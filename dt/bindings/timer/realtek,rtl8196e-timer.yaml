%YAML 1.2
---
$id: http://devicetree.org/schemas/timer/realtek,rtl8196e-timer.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek RTL8196E timer/counter

maintainers:
  - Chung-Wei Lan <zwwe1f@gmail.com>

description: |
  Two 28-bit down counters (TC0, TC1) behind one CDBR divider, on the Lexra
  peripheral bus.  Each counter has a mode bit -- 0 counts once, 1 reloads --
  and a pair of interrupt-enable / interrupt-pending bits in a shared TCIR.

  🔴 The block's `reg` is 0x1c and not 0x20.  WDTCNR sits at offset 0x1c,
  inside what the datasheet calls the Timer/Counter block, and is described by
  realtek,rtl8196e-wdt.yaml as a separate device with a disjoint window.  A
  watchdog node overlapping this one would take -EBUSY from the second
  request_mem_region().

  🔴 This node is a clock provider, and that is the binding's one real design
  decision.  CDBR -- the divider every consumer of this block counts on -- is
  at offset 0x18, inside this node.  The 2.6.30 driver's watchdog reads TC0DATA
  and CDBR directly to derive its own rate, which is only possible because that
  kernel has no ownership model.  The rate having no owner is how a
  LOADER-state constant (14,965,000 Hz) reached a shipped driver's table and
  stayed there while the hardware counted at 200,180 Hz -- wrong by 76x.

  ⚠️ TC0's interrupt number is deliberately not part of this binding.  TC1's is
  25, measured on the device with a three-state control; the vendor's tick
  appears on line 13 and nothing in this project has derived why, so a second
  cell would be a guess in a file that reads like a fact.

  ⚠️ NEVER PROBED ON HARDWARE.  Linux 2.6.30, which is the kernel this driver
  runs on, has no device tree.  See dt/README.md.

properties:
  compatible:
    const: realtek,rtl8196e-timer

  reg:
    maxItems: 1
    description: TC0DATA through CDBR, 0x00 to 0x1b.  Not 0x20 -- see above.

  interrupts:
    maxItems: 1
    description: TC1.  Measured as 25 on the global controller.

  interrupt-names:
    items:
      - const: tc1

  clocks:
    maxItems: 1
    description: the peripheral Lexra bus clock, the CDBR divider's input.

  '#clock-cells':
    const: 0
    description: |
      the CDBR-divided clock, which is what TC0, TC1 and the watchdog all
      count.  Consumers ask this node rather than reading CDBR themselves.

  clock-output-names:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - '#clock-cells'

additionalProperties: false

examples:
  - |
    sysclk: clock-200mhz {
        compatible = "fixed-clock";
        #clock-cells = <0>;
        clock-frequency = <200000000>;
    };

    timer@18003100 {
        compatible = "realtek,rtl8196e-timer";
        reg = <0x18003100 0x1c>;
        interrupts = <25>;
        interrupt-names = "tc1";
        clocks = <&sysclk>;
        #clock-cells = <0>;
        clock-output-names = "tcbase";
    };
