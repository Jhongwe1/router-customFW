%YAML 1.2
---
$id: http://devicetree.org/schemas/mtd/realtek,rtl8196e-sfc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek RTL8196E serial flash controller

maintainers:
  - Chung-Wei Lan <zwwe1f@gmail.com>

description: |
  The SPI flash controller and the memory-mapped read window it also serves.
  Two windows, and they are two because they are two different things: the
  first is four-plus-one registers driven a byte at a time (SFCR, SFCR2, SFCSR,
  SFDR, SFDR2), the second is 4 MiB of address space where a load returns a
  flash byte.

  🔴 `reg` for the register window is 0x14 and not 0x10.  SFDR2 is at 0x1210
  and has never been read on this device, because the loader's `DW` rounds its
  count up and prints only four words.  A `reg` describes the block; 0x10 would
  describe the subset one driver happens to touch.

  🟢 The two paths agree.  On 2026-09-08 a PIO traversal and the memory-mapped
  window were compared over all 4,194,304 bytes and were byte-identical --
  which is what makes this one device with two access methods rather than two
  devices.

  🔴 THE ONLY DRIVER THIS PROJECT HAS FOR IT IS READ-ONLY, BY DESIGN.  Mainline
  is zero-write through R9: the loader region is unrecoverable if destroyed and
  there is no spare unit.  The `read-only` properties on the first two
  partitions in the board file are that rule in machine-readable form.

  ⚠️ NEVER PROBED ON HARDWARE.  See dt/README.md.
  ⚠️ The child `flash` node's partition table uses `fixed-partitions`, which is
  a kernel-subsystem binding and is not in dtschema's corpus.  It is declared
  in dt/unmatched-allow.tsv by name, so the gap is enumerated rather than
  invisible.

properties:
  compatible:
    const: realtek,rtl8196e-sfc

  reg:
    items:
      - description: the controller registers, SFCR through SFDR2
      - description: the memory-mapped read window, 4 MiB

  reg-names:
    items:
      - const: sfc
      - const: map

  clocks:
    maxItems: 1

  '#address-cells':
    const: 1

  '#size-cells':
    const: 1

patternProperties:
  '^flash(@[0-9a-f]+)?$':
    type: object
    description: the NOR device the controller drives.

required:
  - compatible
  - reg
  - reg-names

additionalProperties: false

examples:
  - |
    sysclk: clock-200mhz {
        compatible = "fixed-clock";
        #clock-cells = <0>;
        clock-frequency = <200000000>;
    };

    flash-controller@18001200 {
        compatible = "realtek,rtl8196e-sfc";
        reg = <0x18001200 0x14>, <0x1d000000 0x00400000>;
        reg-names = "sfc", "map";
        clocks = <&sysclk>;
        #address-cells = <1>;
        #size-cells = <1>;

        flash@0 {
            compatible = "realtek,rtl8196e-nor";
            reg = <0 0x00400000>;
        };
    };
