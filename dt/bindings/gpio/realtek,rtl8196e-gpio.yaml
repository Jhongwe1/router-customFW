%YAML 1.2
---
$id: http://devicetree.org/schemas/gpio/realtek,rtl8196e-gpio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek RTL8196E PABCD GPIO

maintainers:
  - Chung-Wei Lan <zwwe1f@gmail.com>

description: |
  One 32-line register set -- CNR at 0x00, an unnamed word at 0x04, DIR at
  0x08, DAT at 0x0c.  A line is a GPIO when its CNR bit is clear and an output
  when its DIR bit is set.

  🔴 `ngpios = <32>` describes the REGISTER and not what is safe to drive, and
  a binding cannot carry that distinction.  On this die exactly one line is
  known to be a GPIO -- bit 5, because it is the only cleared bit of CNR and
  the loader is what cleared it -- and the driver's output-allow mask is 0 for
  that reason.  Two lines have evidence and both are in `gpio-line-names`:
  bit 5 is the reset button (active low, with a pull-up, measured 2026-08-24 as
  an XOR of exactly 0x00000020 between held and released) and bit 6 drives the
  second of the board's eight LEDs (active low, measured 2026-09-09 at both
  levels with the other seven as the negative control).

  ⚠️ WHICH of PABCD's four ports bit 5 belongs to has never been measured, and
  a seating full of PABCD readings looks like it closed that.  It has not.  The
  chip is named for the whole set and a line number is a bit position, which is
  what the driver does and for the same reason.

  ⚠️ `.to_irq` is not provided.  GPIO_ABCD is bit 16 of the global controller
  (docs/interrupt-map.md), so what is missing is the work and not the address.

  ⚠️ NEVER PROBED ON HARDWARE.  See dt/README.md.

properties:
  compatible:
    const: realtek,rtl8196e-gpio

  reg:
    maxItems: 1

  gpio-controller: true

  '#gpio-cells':
    const: 2

  ngpios:
    const: 32

  gpio-line-names:
    minItems: 32
    maxItems: 32

required:
  - compatible
  - reg
  - gpio-controller
  - '#gpio-cells'

additionalProperties: false

examples:
  - |
    gpio@18003500 {
        compatible = "realtek,rtl8196e-gpio";
        reg = <0x18003500 0x10>;
        gpio-controller;
        #gpio-cells = <2>;
        ngpios = <32>;
    };
