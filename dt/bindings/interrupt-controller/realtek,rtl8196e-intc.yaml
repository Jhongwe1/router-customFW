%YAML 1.2
---
$id: http://devicetree.org/schemas/interrupt-controller/realtek,rtl8196e-intc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek RTL8196E global interrupt controller

maintainers:
  - Chung-Wei Lan <zwwe1f@gmail.com>

description: |
  GIMR (mask) at 0x00, GISR (pending) at 0x04, and IRR0..IRR3 -- eight 4-bit
  destination-select fields each -- filling the block to 0x20.  It cascades
  into one Lexra CPU line, which is why /proc/interrupts shows `2: … RLX
  cascade`.

  🔴 THERE IS NO DRIVER FOR THIS AND THAT IS A DECISION, NOT A GAP.  irqchip
  was deliberately kept out of R5: Linux 2.6.30 has no irq_domain, so the shape
  written against it would be the wrong shape, and R10a is where it lands.  The
  node is here because a device tree describes hardware and because every
  `interrupts` cell in this tree needs a parent to mean anything.
  docs/interrupt-map.md owns the routing table and the four arming layers a
  timer interrupt needs.

  🔴 Two measurements that a future driver must not be written without.  First,
  a GISR pending bit latches WHILE MASKED in GIMR, so masked observation is
  sound on this part.  Second, the vendor's tick handler does a
  read-modify-write on TCIR -- a register whose pending bits are
  write-1-to-clear -- a hundred times a second, so any pending bit in that
  register has a lifetime of at most one 10 ms tick.  That bounds every
  single-sample reading of TCIR this project has ever taken.

  ⚠️ NEVER PROBED ON HARDWARE.  See dt/README.md.

properties:
  compatible:
    const: realtek,rtl8196e-intc

  reg:
    maxItems: 1

  interrupt-controller: true

  '#interrupt-cells':
    const: 1
    description: the bit number in GIMR/GISR.

required:
  - compatible
  - reg
  - interrupt-controller
  - '#interrupt-cells'

additionalProperties: false

examples:
  - |
    interrupt-controller@18003000 {
        compatible = "realtek,rtl8196e-intc";
        reg = <0x18003000 0x20>;
        interrupt-controller;
        #interrupt-cells = <1>;
    };
