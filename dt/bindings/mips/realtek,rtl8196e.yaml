%YAML 1.2
---
$id: http://devicetree.org/schemas/mips/realtek,rtl8196e.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek RTL8196E boards

maintainers:
  - Chung-Wei Lan <zwwe1f@gmail.com>

description: |
  The RTL8196E is a Lexra RLX4181 SoC -- big-endian, and NOT MIPS32.  The core
  omits the patented unaligned load/store instructions and exposes the load
  delay slot architecturally, so a build at -march=mips32 miscompiles silently
  and the mflxc0/mtlxc0 pair the vendor port uses to mask an interrupt does not
  assemble at all.  The `lexra,rlx4181` cpu compatible in the SoC file is 量:
  PRId reads 0x0000CD01 on this die and bits 15:8 = 0xCD is PRID_IMP_RLX4181
  in the vendor's own arch/rlx/include/asm/cpu.h.

  ⚠️ There is no mainline platform for this SoC, so there is no arch code these
  boards could bind to today.  This binding exists so the root node of
  dt/*.dts is described rather than silently unvalidated, and so R10a has a
  place to put the board list.

  ⚠️ NEVER PROBED ON HARDWARE.  See dt/README.md.

properties:
  $nodename:
    const: '/'

  compatible:
    oneOf:
      - description: TOTOLINK N150RT
        items:
          - const: totolink,n150rt
          - const: realtek,rtl8196e

additionalProperties: true

...
