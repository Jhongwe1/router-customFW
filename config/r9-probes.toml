# ---------------------------------------------------------------------------
# 7. Last: the three that stress boa's parser.  讀 `D-9` -- one well-formed
#    request has held this single-process server for 4.7-9.7 s and nothing
#    respawns it, so nothing cheaper may queue behind these.
# ---------------------------------------------------------------------------

[[case]]
id = "C25"
kind = "http"
method = "GET"
port = 80
path = "/"
headers = { Transfer-Encoding = "chunked" }
body = "digest"
register_id = "FC-041"
why = "Discriminates the two parsers' strictness at the protocol layer. 讀 notes/httpd.md § 3: rlxfw answers 501 to Transfer-Encoding with ANY value, deliberately, because a tolerant parser in front of anything is a request-smuggling primitive; stock boa ignores the header. Cannot write: a GET with no body, so there is nothing chunked to decode. The row's HTTP/0.9 and version-number axes are outside the instrument, which hard-codes HTTP/1.1."
expect = "vendor 200 (header ignored); rlxfw 501."

[[case]]
id = "C26"
kind = "http"
method = "GET"
port = 80
headers = { X-Rlx-Pad = "" }
path = "/"
body = "digest"
register_id = "FC-067"
why = "Discriminates the header-length bound, with the bound's NUMBER as the claim. 讀 notes/httpd.md § 3: rlxfw answers 431 past 1,024 bytes on one header line, and the value here is 1100 bytes, making the header line 1111 bytes with its name, so the line crosses that bound and nothing else. Deliberately NOT an overflow attempt: the row's parameter-count half is a request body, which R3 refuses, and a value chosen to reach a buffer rather than a declared bound would risk the server this episode needs. Cannot write: a GET with no body."
expect = "vendor 200 or 400 from stock boa's own limit; rlxfw 431. Does NOT establish any bound on the vendor -- only what it did with 1,100 bytes."

[[case]]
id = "C27"
kind = "http"
method = "GET"
port = 80
path = "/"
headers = { Range = "bytes=0-0" }
body = "digest"
register_id = "FC-067"
why = "The Range axis the same row names, which is a read and carries no length risk at all. Discriminates whether each serving program implements partial content: stock boa does, and 讀 notes/httpd.md § 2 rlxfw's route table has no Range handling, so it answers the whole document. Cannot write: a GET of the root."
expect = "vendor 206 with a Content-Range; rlxfw 200 with the full index.html. The status pair is the reading."
