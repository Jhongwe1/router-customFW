# ---------------------------------------------------------------------------
# 5. Normalisation and method handling.
# ---------------------------------------------------------------------------

[[case]]
id = "C19"
kind = "http"
method = "GET"
port = 80
path = "//config.dat"
body = "none"
register_id = "FC-038"
why = "Discriminates the two parsers' normalisation. 讀 notes/httpd.md § 3.1: rlxfw refuses an empty segment before the byte is stored and then reads the whole decoded string again for `//`, so this is 400 by construction; the vendor runs stock boa alias.c. The target is a document C11 already reads, so the variant is the only variable and a 200 here means the normaliser accepted it. Cannot write: a GET, and the path reaches no handler and holds no `htm`."
expect = "vendor 200 or 404; rlxfw 400. 🔴 body = none: the target is this unit's configuration. The row names ~30 variants; this and C20 take the two rlxfw refuses by independent rules."

[[case]]
id = "C20"
kind = "http"
method = "GET"
port = 80
path = "/./config.dat"
body = "none"
register_id = "FC-038"
why = "The second variant, refused by rlxfw's OTHER rule: 讀 notes/httpd.md § 3.1 every `.` and `..` segment is refused, separately from the empty-segment test. A traversal that ESCAPED the document root was deliberately not written -- it would pull a file this gate has no business recording. Cannot write: a GET, no handler, no `htm`."
expect = "vendor 200 or 404; rlxfw 400. 🔴 body = none."

[[case]]
id = "C21"
kind = "http"
method = "OPTIONS"
port = 80
path = "/"
body = "digest"
register_id = "FC-039"
why = "Discriminates the method-handling layer, which is the only one of this row's four bypass axes a read can reach. 讀 notes/httpd.md § 2: rlxfw answers a known path with the wrong method 405 and names the methods in Allow. A header-based bypass was NOT written: Referer and X-Forwarded-For are ignored by both on an ungated path, so that probe would read the same on both columns for a reason unrelated to the row, and a crafted Host belongs to the held D-14 rows. Cannot write: OPTIONS reaches no handler and the root holds no `htm`."
expect = "vendor 501 or 200 from stock boa; rlxfw 405 with Allow: GET, POST. PUT and DELETE are spellable by the instrument and are refused by R3."

[[case]]
