# fix-cases.toml -- `R9-1`'s per-case differential register.
#
# GENERATED, one row per upstream test case, derived from `upstream/test-cases.toml`
# at the submodule pin `4d3ff26bfb8a32986d3db532ca25197ef3043fdb`.  Re-derive; never hand-edit.
#
# WHAT THIS FILE IS, AND WHAT IT IS NOT
# =====================================
# `R9-1` asks for "one row per upstream case carrying mechanism class, evidence
# tier, ④'s check and reading, and the refutation written BEFORE the result".
# That is this file.  It is the REGISTER.  `R9-8`'s `docs/differential.md` is
# the published TABLE and owns the four columns and the five uncontrolled-
# variable classes; this file owns no published claim and never restates a
# reading another file owns -- it CITES it.  In particular
# `docs/boot-time-table.md` § 6 already owns the per-feature vendor/rlxfw
# comparison with its own `class` column (identical / comparable / not
# comparable), and the rows below cite it rather than copying it.
#
# THE PASS CLAUSE THIS REGISTER IS BUILT AGAINST
# ==============================================
# `PROGRESS.md`'s `R9` re-specification, not `plan/` § 8's wording.  The plan's
# distinctive clause -- 「修不掉」那欄不是空的 -- is satisfied by SEVEN rows
# committed in `plan/` § 8.2 before `R9` existed (NX, ASLR, seccomp /
# no_new_privs, real secure boot, the physical attacker, the vendor WiFi driver,
# the loader's unauthenticated TFTP rescue), so no `R9` outcome can leave the
# column empty.  Replaced per-row by:
#
#   ① `mechanism_class`, from the CLOSED SET <架構性 / 有界化 / 服務不存在 /
#      不適用>, the primary key;
#   ② `vendor_evidence`: a reading from `V-A`/`V-B`/`V-C` naming its capture or
#      artefact, or `⊘ Structural` naming the committed finding;
#   ③ `rlxfw_evidence`, from THE SAME INSTRUMENT as ②.  `same_instrument` names
#      that instrument once, for both, and `same_instrument_pair` says whether
#      this repository actually has it for both columns;
#   ④ `opposite_check` -- a check that would have detected the OPPOSITE of what
#      the row claims -- with `opposite_check_reading`, that check's reading.
#      A row whose reading is 未定 publishes 未定, never a win.
#
# HOW `publish` IS DERIVED (mechanically, in the generator; never chosen)
# ======================================================================
#   未定            ④ has no reading, OR there is no same-instrument pair, OR
#                   the vendor side is not executable in this gate.
#   surface-absent  a 服務不存在 row whose instrument reads the BINARY rather
#                   than the SOCKET.  It may claim the surface is absent and no
#                   more.
#   not comparable  a 不適用 row: no behaviour either firmware serves.
#   win             pair complete, ④ has a reading, and the vendor side is
#                   executable inside a zero-flash-write gate.
# `publish_reason` carries which branch fired.
#
# TIER IS DERIVED FROM WHAT THE CASE NEEDS, NEVER FROM WHAT IS CHEAP
# ==================================================================
# That is `R9-1`'s own named failure mode -- "assigning a tier from what is
# cheap to measure instead of from what the case needs, which silently converts
# a `V-D` into a fake `V-A`".  The rule is applied to the case's OWN field named
# in `tier_basis_field`, whose decisive content is quoted in `tier_basis`:
#
#   V-D  the refutation needs a reading from INSIDE the running vendor system
#        (a file read, a process list, a register or memory inspection, a binary
#        run on the device) => `⊘ Structural`, cited from `P2`, never
#        re-derived.
#   V-A  the refutation is phrased about a reply on the wire or an effect
#        observable from the host, with a network request or host observation as
#        the stimulus.
#   V-C  the refutation is satisfied by what the vendor boot prints unprompted.
#   V-B  the refutation is satisfied by a static read of the dump-derived tree,
#        the vendor source, or a loader-mediated flash read.
#
# PAYABILITY IS A SEPARATE AXIS and never moves the tier.  `tier_payable` is
# false, with `blocker` saying why, when executing the vendor side inside this
# gate is forbidden or impossible: a stimulus that writes flash (`VDR-1`; 量
# `P10-10` -- firing `formSysCmd` writes `SYSCMD_SELECT` to `COMPCS` at flash
# `0x00C000`), a destructive action, an instrument this repository does not
# have, or an upstream case that was cut.  Eleven rows additionally carry
# `costs boa` in `blocker`: their vendor stimulus removes the vendor's web
# server for the rest of the one seating `R9-6` budgets.
#
# ⚠️ V-A HAS NO INSTRUMENT YET, AND THAT IS ALREADY THE STEP LIST'S VIEW.
# 讀 `tools/hostprobe.py`: it records host events "with timestamps and nothing
# else -- never a packet's contents, never a frame".  `R9-3` exists to write
# `tools/diffprobe.py` for exactly this reason.  So every `V-A` row's vendor
# cell is a reading this repository CAN take and has not taken, which is
# different from one it cannot take; the distinction is in `blocker`.
#
# ⚠️ V-C'S REACH IS 1,789 BYTES.  量: each `V*-BOOT` capture is a
# `--until "port 80"` run and stops at boa's third line, so V-C cannot see a
# service that starts after boa.  And a console banner is 量 evidence that a
# binary was exec'd at boot, NOT that its socket is open later -- upstream's
# `D-19` 量 that one request terminates the UPnP daemon and nothing respawns
# it.  That is why a 服務不存在 row read through V-C publishes
# `surface-absent`, while one read through the TCP port census publishes `win`.
#
# SCHEMA
# ======
#   id                      FC-nnn, assigned by sorted upstream id.  Stable only
#                           while the population is; cite `upstream_id` across
#                           files.
#   upstream_id             the `[[case]]` id in `upstream/test-cases.toml`.
#   title                   the upstream title -- EXCEPT on a held row, where it
#                           is REPLACED by a class-level description carrying no
#                           reproduction, no endpoint, no parameter and no
#                           payload.
#   mechanism_class         the closed set.  架構性: rlxfw's design removes the
#                           whole class, so no construct in rlxfw could carry
#                           it.  有界化: rlxfw has the same surface, bounded,
#                           with the bound's NUMBER as the claim.  服務不存在:
#                           the vendor service that hosts the defect is not in
#                           rlxfw's image.  不適用: not a claim about
#                           firmware-served behaviour rlxfw could inherit -- an
#                           instrument, a lab condition, the loader, the board,
#                           a cut case, or an advisory-corpus question.
#   evidence_tier           V-A | V-B | V-C | V-D, derived as above.
#   tier_basis_field        THE FIELD of the upstream case the tier is derived
#                           from.  REQUIRED: a tier with no basis is a defect.
#   tier_basis              that field's decisive content, quoted.
#   tier_payable / blocker  whether the vendor side can be executed in this
#                           gate, and why not.
#   anchor                  which evidence anchor supplied ②③④, so a correction
#                           to an anchor is one edit and not 141.
#   same_instrument         the one instrument ② and ③ are both read with.
#   vendor_evidence         ②.
#   rlxfw_evidence          ③.
#   same_instrument_pair    false when the vendor half rests on an instrument
#                           this repository does not have.
#   opposite_check          ④.
#   opposite_check_reading  ④'s reading, or 未定 followed by SETTLED BY.
#   refutation              written BEFORE any result, per mechanism class.
#   residual                殘留: what the class does NOT cover for this row.
#   held / held_disclosure_ids
#                           true when a held upstream disclosure row names this
#                           case id, and which.
#   instrument_substituted  true when ② would rest on an UPSTREAM instrument
#                           this repository does not have and has not
#                           reproduced on the same population.
#   upstream_verdict / upstream_evidence_kind / upstream_cut
#                           from `upstream/reports/test-results.json` and the
#                           register, carried AS DATA, never as this gate's
#                           vendor cell.
#   publish / publish_reason
#                           derived, as above.
#
# THE PARTITIONS, WITH COUNTS
# ===========================
# `R9-2` asks for the partition into `V-A`/`V-B`/`V-C`/`V-D`.  The brief this
# register was built from asked for the partition by mechanism class.  BOTH are
# here, because they answer different questions and neither is the other.
#
#   mechanism class            tier
#     架構性         35            V-A   89
#     有界化         15            V-B   29
#     服務不存在     18            V-C   10
#     不適用         73            V-D   13
#     ----------------            ---------
#     total       141            total 141
#
# NO CLASS AND NO TIER IS EMPTY.  Every count in this header is derived by the
# generator from the rows below and is re-derivable:
#
#     python3 -c "import tomllib,collections; d=tomllib.load(open('config/fix-cases.toml','rb')); \
#       print(collections.Counter(r['mechanism_class'] for r in d['row']), \
#             collections.Counter(r['evidence_tier'] for r in d['row']))"
#
# `tools/fixcases.py check` does that and refuses on a mismatch; its
# `--self-test` plants the rows `R9-1`'s DoD names and requires each refusal to
# fire.  A count in a comment with no checker is a count that rots.
#
#   publish: win 17, surface-absent 5, not comparable 42, 未定 77
#   held 16; resting on a substituted instrument 42;
#   with no same-instrument pair available here at all 111;
#   ④ has a reading 109; ④ reads 未定 32
#
# HELD DISCLOSURE ITEMS -- MEASURED, NOT TAKEN FROM A LIST
# ========================================================
# 讀 `upstream/docs/disclosure.md` at the pin: the status column of THIRTEEN of
# its nineteen rows reads `held` -- `D-3`, `D-4`, `D-9`, `D-10`, `D-11`, `D-12`,
# `D-13`, `D-14`, `D-15`, `D-16`, `D-17`, `D-18`, `D-19`.  `D-15` is marked the
# most serious in the table; `D-19` is marked held AND NOT SEARCHED.  The other
# six: `D-1` withdrawn, `D-2` does not reproduce on this build, `D-5` and `D-6`
# publishable (`D-6` published), `D-7` not a finding yet, `D-8` two of three
# resolved.
#
# 🔴 `plan/` § 15 and `PROGRESS.md`'s `R9` re-specification both say FOUR are
# held (`D-4`, `D-11`, `D-15`, `D-19`).  AT THE PIN THE COUNT IS THIRTEEN.  This
# register follows the pin, because `plan/` § 15's own rule is *a named fix
# follows upstream's disclosure state* and the pin IS upstream's state.  The
# discrepancy is a finding against the two state files, not against the pin, and
# it widens `R9-8`'s DoD from four ids to thirteen.
#
# `plan/` § 15's three tiers, applied: a CLASS-LEVEL fix ("my rootfs has no
# `system()`") is publishable; a NAMED fix follows upstream's state, so held
# means do not write it; a REPRODUCTION never appears in this repository while
# the row says held.  So every `held = true` row carries a class-level title and
# a class-level residual: no endpoint, no parameter name, no payload, no
# request, no address.  The upstream title is NOT copied onto a held row.
#
# INSTRUMENT SUBSTITUTION
# =======================
# 讀 `upstream/test-ledger.md`: 118 of 141 cases ran, 82 closing on real-device
# dynamic evidence -- with UPSTREAM's instruments (`paramfuzz.py`,
# `handler-sweep.py`, `cve-endpoints.py`, `bughunt.py`, `crash-triage.py`,
# `device-liveness.py`, `failopen-probe.sh`).  None is in this repository and
# none has been re-run here, so CLAUDE.md's rule binds: accept a changed
# instrument only if it reproduces the old verdicts on the same population.  An
# upstream device-closed result is therefore NOT this gate's vendor cell, and
# `upstream_verdict`/`upstream_evidence_kind` are carried as data only.
#
# WHAT THIS REGISTER DOES NOT ESTABLISH
# =====================================
# * Not one row is a reading taken from the vendor firmware while it served a
#   request.  `V-A` has been spent on the connection only (`P2`'s `D4`), and the
#   instrument that would send a request and read the reply is `R9-3`'s and does
#   not exist yet.
# * 量 `TC-53`: this platform's toolchains REFUSE `-fstack-protector-strong`,
#   `rsdk-1.5.5` accepts `-fstack-protector` and emits no guard while exiting 0,
#   and `_FORTIFY_SOURCE` has nowhere to land (0 `__*_chk` entry points in all
#   three `libc.a`).  `config/rlxfw-cflags` carries exactly one flag,
#   `-fno-if-conversion`, and it is a kernel flag.  So `plan/` § 8's
#   memory-safety row claims compiler hardening this repository has measured as
#   unavailable, and every 有界化 row rests on the parser's own bounds alone.
#   A finding against `plan/` § 8, recorded rather than papered over.
# * 讀 `notes/httpd.md` § 10 and `docs/KNOWN-ISSUES.md`: **no TLS** -- every
#   password sent to rlxfw's httpd crosses the LAN in clear.  So `P8-17`'s class
#   is one rlxfw does NOT fix.
# * 量 `entropy_avail` read 0 at 768 s and 0 at 1,613 s on this board, so
#   rlxfw's LOGIN and PWSET return NOENTROPY 503: a password cannot honestly be
#   set on this unit today.  That is the fail-closed design working, not a fix
#   exercised.
# * 量 `FW-182` and `FW-184`: two defects were found in rlxfw's own
#   authentication path ON THE DEVICE, and `notes/httpd.md` § 11.7 says the fix
#   has not run on the device.
# * THE CLOSED SET HAS NO SLOT FOR "rlxfw does not fix this".  `plan/` § 8.2's
#   seven platform limits, and `P8-17`'s missing TLS, have no member of
#   <架構性 / 有界化 / 服務不存在 / 不適用> that fits; they are filed 不適用
#   with the limit named in `residual`, which is the least wrong cell and not a
#   right one.  A fifth class -- 平台限制 / 修不掉 -- is the obvious repair and
#   it is the owner's to make, because the closed set is the gate's primary key.
#   The rows affected are `P4-5`, `P5-1`, `P5-2`, `P5-3`, `P8-17`, `P8-19`,
#   `P9-9`, and the eleven loader rows.
#
