opposite_check = "the manifest tool must refuse an entry whose tag does not match its source path, and must refuse a missing source rather than skipping it -- otherwise a declared `/etc` proves nothing about the shipped one"
opposite_check_reading = "量 `tools/test-config-gates.sh`: `M1` (a missing source file skipped instead of refused) requires `A2` to fail, `M3` (the `unit` tag stops being checked) requires `A5` to fail, `M4` (the `unit` counterpart check becomes a no-op) requires `A13` to fail, and `M5` (the manifest digest taken over the path rather than the bytes) requires `A11` to fail. ⚠️ and the half that is NOT fixed: 量 `FW-160`, the entropy pool on this board is empty and stays empty, so rlxfw's answer at first boot is a fail-closed refusal to issue a token, not a good key"
refutation = "REFUTED IF a construct that could carry this class is found in rlxfw's shipped bytes by the same instrument that read the vendor side: for the shell class, one implementation of a process-starting name other than the one named exemption; for authentication and authorisation, one route reachable without its declared session or CSRF check, or one comparison that is not exact-match; for escaping, one byte of a request appearing in a response body or header. Written before the reading."
