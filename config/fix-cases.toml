rlxfw_evidence = "讀 `config/rlxfw-initramfs.tsv`: `/etc` holds only `passwd` and `group`, both tagged `rlxfw`, and **every shell field is `/bin/false`** -- 量 `R78-pw` on the board read all three rows that way. There is no factory password: plan/ § 8 names 'no factory password, forced at first boot, no factory account exists'"
