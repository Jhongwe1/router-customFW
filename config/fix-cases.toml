vendor_evidence = "⊘ Structural for the instruction-level half: `docs/GATE-RESULTS.md` entry 13 (2026-09-25), `P2`, § What `P2` did not establish, \"⊘ Structural, not deferred: the vendor firmware has no shell, so its iperf3, its /proc, its runtime memory and its per-daemon CPU time are not measurable\"; basis `docs/history/steps-P2.md` § Settled before any script, item 1. The vendor's parser was read at instruction level by UPSTREAM's Ghidra work, which is not this repository's instrument and has not been reproduced here on the same population"
rlxfw_evidence = "讀 `notes/httpd.md` § 2 (eleven routes over ten path patterns, GET and POST only, 405 with `Allow: GET, POST` on a known path with the wrong method, one fixed 404 document), § 3 (the limits table: request line 1,024 B -> 414; 32 header lines and 4,096 header bytes -> 431; one header line 1,024 B -> 431; body 4,096 B -> 413; `Content-Length` required on POST -> 411; `Transfer-Encoding` any value -> 501; decoded path 128 B, <= 2 segments, name <= 64 B; 8 concurrent connections and 4 per address -> 503; 5 s header, 10 s body, 20 s `alarm`; static file 262,144 B -> 404; JSON 24 members, 64 B per string, depth 1), § 3.1 (the decoded-path byte set is `[A-Za-z0-9._/-]` and `%` is NOT in it, so `%252e` decodes to a literal `%` and dies) and § 4 (the privilege drop, eight checked steps, no `--no-chroot` flag)"
same_instrument_pair = "incomplete"
opposite_check = "break one bound in the shipped parser and require the matching test case to go red; and require the privilege drop's own step 8 -- `setuid(0)` must FAIL -- to be observed"
opposite_check_reading = "量 2026-09-30, host: mutation `hdrcap` goes **RED on 1 case** (33 header lines refused with 431), and `traversal`, `linebound` and `offbyone` are the other three mutation controls; `test_http` 105 cases, `test_routes` 133 cases; `rootcheck` 24 of 24 run as root, with `/proc/<pid>/root` read back as the web root and the 5th connection from one address getting 503; five login POSTs give `503 503 503 429 429`; a traversal battery of 34 targets; 256 truncations and 2,022 corruptions with 0 crashes and the invariant `body_len == clen <= 4096` holding on every accepted parse. 量 on the die 2026-09-30: `dnsfwd` printed `setuid(0) refused (Operation not permitted)` (`FW-175`). ⚠️ `notes/httpd.md` § 7.1's own caveat: the planted off-by-one on the 1,024-byte line bound is INTRA-STRUCT, and ASan returns 0 on it -- \"ASan's silence about an intra-struct overflow is not evidence\""
refutation = "REFUTED IF a construct that could carry this class is found in rlxfw's shipped bytes by the same instrument that read the vendor side: for the shell class, one implementation of a process-starting name other than the one named exemption; for authentication and authorisation, one route reachable without its declared session or CSRF check, or one comparison that is not exact-match; for escaping, one byte of a request appearing in a response body or header. Written before the reading."
residual = "plan/ § 8: the vendor has about thirty renderers using raw `%s`; rlxfw has a single template layer that escapes by default. 讀 `notes/httpd.md` § 6.3: the error tokens are a closed set of string literals selected by a switch, and no response body or header in the program contains a byte from the request. ⚠️ that last sentence carries no 量 token in its own file"
