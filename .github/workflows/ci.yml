# CI for rlxfw.
#
# What this is for, and what it deliberately is not
# -------------------------------------------------
# `README.md` says every instrument here ships with the controls that show it
# can fail. That is an unfalsifiable sentence until something runs them, which
# is the whole reason this file exists at all -- a long run of commits with
# nothing outside the repository checking them is what "no external clock" looks
# like while it is happening.
#
# 2026-08-27: this line used to read "33 commits and an empty `git tag`". Both
# halves were stale -- measured, 52 commits and one tag, `v0.0`. It is written
# without a count now, because the sentence never needed one and a number that
# goes wrong on the next commit is the exact failure this header spends forty
# lines warning about further down.
#
# It is NOT a build of the firmware. There is no firmware. Every job here runs
# instruments against committed text.
#
# The census job is the one that matters
# --------------------------------------
# A green badge over a suite that quietly shrank is exactly the failure this
# project's own rule names: a tool reporting 0 is making a claim, and a tool that
# cannot fail proves nothing. So every suite tees its output, and
# `tools/ci-census.py` asserts, per suite,
#
#     ok + FAIL + sum(covers of every skip printed) == that suite's bench total
#
# against `tools/ci-expected.tsv`. A skip label that is not on the list turns the
# build red. So does arithmetic that does not close -- which is the only thing
# that catches a case disappearing with neither a FAIL nor a skip line, and that
# has happened here.
#
# WHY THE CROSS COMPILER IS NOT INSTALLED, which looks like an omission
# ---------------------------------------------------------------------
# `gcc-mips-linux-gnu` would let `tools/test-rlxprobe.sh` build its payloads.
# It would then invoke `tools/hazlint`, whose K4 population control is
# `$FWRE_WORK/stage2.bin` -- 56 KiB of this unit's own vendor bootloader, which
# is someone else's property and identifies one physical device, so it can never
# be committed. hazlint exits 2 rather than report without that control, and
# **that refusal is correct**: a checker whose population control did not run is
# a checker nobody has shown to be looking. So installing the compiler turns 101
# cases red for a reason that is not a defect. MEASURED 2026-08-27, on the bench
# machine with $FWRE_WORK pointed at an empty directory: with the cross tools
# present, `test-hazlint` is 73 ok / 32 FAIL / 12 skip covering 37 (量 2026-08-28,
# fifth segment, at 142 cases; it was 50 / 30 / 11 at 109 and 45 / 30 / 8 at 96)
# and `test-rlxprobe` is 101 ok / 101 FAIL. What is worth reading twice: all
# SEVEN of hazlint 1.5's `cli` controls -- the ones TC-j was about, which drive
# the real command line as a subprocess -- pass HERE, with $FWRE_WORK empty.
# They need no vendor artefact. What keeps this suite bench-only is K4/K4b's
# population fixtures and nothing else. Without gcc, both skip cleanly, the
# census is green, and it prints
# `NOT RUN IN THIS JOB: 452 case(s)` with every one of them named.
#
# 🔴 **2026-08-29: this number is no longer maintained here, because it was
# wrong and nothing could say so.** It read 362 while the green run of
# 2026-08-28 14:18 printed **373** -- off by 11 for at least a day, in the file
# whose own header spends forty lines warning about a number that was true once.
# It now lives in `tools/ci-expected.tsv` as `# not-run-total:`, where
# `ci-census.py` READS it and turns the build red if it disagrees (`C15`, with
# both directions and a mutation). The value quoted above is a convenience for
# the reader; the table is the owner.
#
# 452 -> 455 on 2026-08-30 (ninth session): `flashwin` arrives at 13 with one
# allowed skip covering 3 -- R1-R3 render two committed captures out of this
# unit's own 4 MiB flash dump, which can never be committed. Its ten synthetic
# controls, including the publication guard driven as a subprocess in all three
# directions, run here. `test-console-capture` went 29 -> 40 and
# `test-gitignore` 18 -> 21 in the same session and moved this number by ZERO,
# which is the property worth having in a case.
#
# 478 -> 491 on 2026-09-04 (thirty-second session, `R5-3a`):
# `test-hazlint-objs` goes 28 -> 41 -- `--also DIR` puts `drivers/` in the
# sweep, because every one of R5's six drivers is under it and P2 would
# otherwise report 0 violations over a population containing no driver of
# mine (HAZ-1). The whole row is *bench-only*, so all thirteen land here.
#
# 406 -> 452 on 2026-08-29 (sixth session): `test-rtkimage` arrives at 32 with
# one allowed skip covering 18 (it reads the GPL drop's own nfjrom), and
# `test-hazlint-objs` arrives at 28 and is *bench-only* for exactly the reason
# spelled out above -- every one of its cases drives `hazlint`. `test-deskchan`
# arrives at 18 and adds NOTHING here: the apt line installs qemu-system-mips
# and the suite then runs in full, because its end-to-end case assembles its
# own twelve-instruction MIPS payload instead of borrowing a vendor one.
#
# 373 -> 406 on 2026-08-28/29 (fifth session): `test-hazlint` 109 -> 142 for `TC-j`.
# The thirty-three are M17-M20 (the three mutations that recreate `TC-f` through
# `main`, plus the one that proves the child guard is not itself a blind spot)
# and the assertions that the control report now names which layer each row
# reached. ⚠️ **The whole 142 is counted here and that OVERSTATES what stands
# down**: 量, all seven `cli` controls and every M17-M20 case run on a runner.
# The row is a whole-suite exemption because K4 fails without `stage2.bin` and a
# suite that exits 1 cannot be in this job at all -- not because these cases
# need anything. Splitting the row is the honest fix and it is not done here.
#
# 353 -> 362 on 2026-08-28 (third session) when `test-vendor-tripwire` (32) and
# `test-tc-smoke` (36) arrived. Only NINE of their 68 cases stand down here, and
# the first draft of this comment said 32 of the tripwire's 32 did: that version
# of the suite ran NOTHING without a vendor GPL drop, which is every runner, so
# the step went green even if the tool had been deleted. The adversarial review
# of the same session found it; the suite now builds its own git repository with
# an ignore rule and runs 28 of 32 anywhere. What genuinely cannot run here is
# T10 (needs the real rsdk-linux-config to trip the wire on) and T13 (the
# default discovery path reads $FWRE_WORK), plus tc-smoke's five B-cases.
# 量 in the runner configuration ($FWRE_WORK empty): the census closes at 160
# with `test-rlxprobe` running and failing, and 160 + 202 = 362 once it skips
# for want of a cross gcc.
#
# 320 -> 353 on 2026-08-28: `test-hazlint` 96 -> 109 (hazlint 1.3 refuses a range
# containing MIPS16, which this unit's own kernel turned out to have, and the
# refusal needed a control and two mutations), plus `test-isa-probe` arriving
# with twenty of its FORTY-EIGHT needing a vendor toolchain that is not in a
# clone -- the twenty is what this total counts and it did not move when the
# suite grew 40 -> 48, because all eight new cases are stub-driven and run here.
# The number this line does NOT carry is `test-opcount`'s: it went 15 -> 29 and
# every one of the fourteen runs here, because its material is a hardcoded fixture.
#
# 2026-08-28, second pass: the adversarial review of the same session added five
# `test-opcount` cases and eight `test-isa-probe` ones, and every one of them is
# a mutant that the first version of those suites could not see. The total here
# is unchanged at 353 precisely because none of them needs vendor material --
# which is the property worth having in a case, not the count.
#
# 298 -> 306 on 2026-08-27 (second session) when `binsim` and `test-binsim`
# arrived: binsim's twenty-three controls run here in full, and eight of
# test-binsim's 71 stand down because they read the six vendor trees.
#
# 306 -> 320 on 2026-08-27 (third session), and none of the fourteen is a new
# kind of gap: `R2a/b/d-1` replaced the plan's refuted `@floor`, the real corpus
# stopped taking the REFUTED branch, and the fourteen cases that replaced it are
# fourteen more readings OF THE SIX TREES -- the floor cell and its denominator,
# the three-program population it is the top of, what a compilation-model change
# alone costs, the named cell's rank swept over k in both directions, and the
# two version banners that are the premise of the choice. binsim itself went
# 23 -> 24 synthetic controls and all of them still run here; the two new ones
# that do not (`E7`, `E8`) need the vendor trees by construction.
#
# THAT 101/101 WAS A NUMBER NOTHING COULD CHECK until the same afternoon.
# `tools/test-rlxprobe.sh` re-indents `tools/hazlint`'s twelve controls into its
# own stdout, and `ci-census.py`'s case regexes were anchored `^\s*`, so with the
# cross compiler present the census read that configuration as 116 ok / 107 FAIL
# against a bench total of 202 and reported "cases went missing" -- which was
# false, and which never fired here because this job does not install the
# compiler. Anchored at exactly two spaces now (C11/C11b), and the census reads
# 101 + 101 = 202 there.
#
# Those two pairs and that 298 were 17/14/8, 20/25 and 101, then 29/37, 20/26/5
# and 122, and every earlier one was wrong in the same direction: `test-rlxprobe`
# went 45 -> 62 -> 66 -> 106 cases and the header was not re-measured each time.
# 2026-08-25, third revision: it is 106 now, `test-hazlint` is unchanged at
# 20/26/5, and the two new text-job suites -- `test-reply-size` and
# `test-boot-timeline`, 12 cases each -- run in CI and are not in that 162.
# 2026-08-27, fourth: 202 and 96, and the pair went 43/26/8 then 45/30/8 inside
# one afternoon as the adversarial review added M13 and M14. Both intermediate
# readings are listed because this header's failure mode has always been a
# number that was true once. `test-hazlint`'s 20/26/5 moved to 45/30/8 --
# and one of the six that stopped failing is the only one that MATTERS here,
# because it was never a property of the runner. `ck "self-test -> 0" 0 "$?"`
# read the exit status of the `[ -n "$STAGE2" ]` in front of it, so on this
# bench machine it could not fail and on a runner it could not pass. Both
# halves of that were being reported as facts about the environment.
#
# A workflow file whose comment predicts a
# number its own first build contradicts is exactly the badge this project says
# is not evidence, so the numbers here are re-measured whenever a suite grows,
# and `tools/ci-expected.tsv` is the machine-readable copy the census checks.
#
# That same measurement is where `tools/ci-census.py` earned its keep on its
# first real input. It read 20 + 23 = 43 against a bench total of 45 and refused
# the build: TWO cases had been vanishing out of `test-rlxprobe`'s A2 with
# neither a FAIL nor a skip line, because they sat inside an `if [ -s ... ]`
# guard. Nothing that counted skip lines could have seen it. Fixed the same
# afternoon, and that configuration then read 20 + 25 = 45. The suite is 66
# cases now; the arithmetic is the point, not the total.
#
# `binutils-mips-linux-gnu` IS installed: it buys `test-opcount`'s
# hardcoded-fixture control, which re-assembles the fixture and compares, and it
# does not pull hazlint in.

name: instruments

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  text:
    # Everything here is a property of committed text and needs no apt at all.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # spec-check.py walks the owners named in SPEC.md, and most of them
          # live under upstream/. Without the submodule it exits 1 on findings
          # that are an absent checkout, not a defect in the file.
          submodules: recursive
          # 🔴 0, NOT 1, since 2026-09-15 and it is load-bearing for citecheck.
          # Its oracle is `git blame` on the CITING line, and 量 on a --depth 1
          # clone of this repository `git blame PROGRESS.md` attributes every
          # line to ONE commit against 132 in a full clone -- so the cited file
          # "as it was at the citing commit" is the cited file now, every
          # citation reads STABLE, and the check cannot fail. citecheck REFUSES
          # on a shallow repository rather than reporting that, so with 1 here
          # the step would go red with a REFUSING line instead of going quietly
          # green; the cost is the full history on this job.
          fetch-depth: 0

      # 🔴 `id: prep` and the `if:` on every step below it, 2026-09-19.
      #
      # Until today this job aborted at its first failing step and SKIPPED the
      # rest, so a push could only ever show ONE red.  That is not a small
      # inconvenience: on 2026-09-19 `docs/KNOWN-ISSUES.md` said eight suites
      # were red (from a desk sweep, which runs every step) and `a411b35`
      # corrected it to two (from CI, which had stopped at the first) -- and
      # BOTH numbers were right about different things, which is the worst
      # shape a disagreement can have.  Eight reds would have cost eight
      # pushes at ~18 minutes each.
      #
      # `!cancelled()` and NOT `continue-on-error: true`: the second marks the
      # step green and takes the run green with it, which is this file's own
      # `EXIT CODE: 0` incident bought deliberately.  With `!cancelled()` every
      # step runs and the job still FAILS.  `always()` is rejected because it
      # also runs when a human cancels the run.
      #
      # `steps.prep.outcome == 'success'` is the ordering the platform has no
      # per-step `needs` for: if checkout fails, `prep` is skipped, its outcome
      # is not `success`, and the suites below stay skipped instead of
      # reporting forty-five failures in an empty directory.
      #
      # 否證, written before the first run that carries this: the next red push
      # must report MORE THAN ONE failing step in this job.  If it still
      # reports exactly one, the guard did not take effect.
      - name: capture dir
        id: prep
        run: mkdir -p ci-out

      - name: spec-check
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/spec-check.py 2>&1 | tee ci-out/spec-check.out; exit "${PIPESTATUS[0]}"

      - name: test-gitignore
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: bash tools/test-gitignore.sh 2>&1 | tee ci-out/test-gitignore.out; exit "${PIPESTATUS[0]}"

      # Reads the git INDEX rather than the working tree, because the working
      # tree is what DrvFs lies about on the machine this repo is developed on.
      # A depth-1 checkout still produces a full index, so this is meaningful here.
      - name: test-kbuild-cflags
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: bash tools/test-kbuild-cflags.sh 2>&1 | tee ci-out/test-kbuild-cflags.out; exit "${PIPESTATUS[0]}"

      - name: test-file-modes
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: bash tools/test-file-modes.sh 2>&1 | tee ci-out/test-file-modes.out; exit "${PIPESTATUS[0]}"

      # Both of these read `bench/`, which is committed, and need nothing but
      # python3. reply-size sweeps 133 capture metadata files against the
      # loader's reply-length model; boot-timeline reads the .timing files
      # beside them. Neither touches a device and neither needs a compiler.
      - name: test-reply-size
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: bash tools/test-reply-size.sh 2>&1 | tee ci-out/test-reply-size.out; exit "${PIPESTATUS[0]}"

      - name: test-boot-timeline
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: bash tools/test-boot-timeline.sh 2>&1 | tee ci-out/test-boot-timeline.out; exit "${PIPESTATUS[0]}"

      # 2026-08-29 (R3-7). Until today this tool was in no workflow, no
      # expected table and no census -- measured 2026-08-25 and still true
      # this morning, which is `a gate nobody runs` in the file whose whole
      # subject is gates nobody runs.
      #
      # `--self-test` and NOT a real predictions file, and the reason is that
      # pointing it at one could not work: bench/2026-08-25b's block3 reports
      # `1 of 3` because two cells were made unrunnable by the reading of the
      # first, and a block written the day BEFORE a seating reports `0 of N`
      # until the seating happens. Both are correct results and both exit 1.
      #
      # FIFTEEN controls, EIGHT of which must fail, and six of the fifteen
      # drive the file as a SUBPROCESS and assert its exit code. That is not
      # thoroughness for its own sake: the first version had six controls, all
      # function-level, and a mutation pass killed only 7 of 15 mutants --
      # including one that made the sweep return 0 on a real regression, which
      # is the entire content of a gate. 11 of 11 now.
      # Its own case count is a count: `run_controls` prints one line per
      # control that RAN and refuses if the set does not match, because a
      # suite that prints a constant tuple of labels reports controls that did
      # not execute -- measured, on this file, by deleting a control block.
      - name: check-predictions self-test
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/check-predictions.py --self-test 2>&1 | tee ci-out/check-predictions.out; exit "${PIPESTATUS[0]}"

      # tcheck reads an rtl819x-timer /proc dump out of a console capture and
      # recomputes what the driver says it derived.  Its fourteen controls run
      # against captures committed here -- bench/2026-09-03/TM-1.log for the
      # version-1.0 shape and six of bench/2026-09-04/* for version 2.0 -- so
      # nothing outside the repository is needed and there is no allowed skip.
      # 🔴 Three of the controls exist because this tool was WRONG about a
      # real dump before they were written (T6, T7, T8), and two more exist
      # because the mutation suite below showed they were passing for the
      # wrong reason (T5, T9).
      - name: tcheck self-test
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/tcheck.py --self-test 2>&1 | tee ci-out/tcheck.out; exit "${PIPESTATUS[0]}"

      # And the claim that those controls bite: nine mutants of tcheck.py,
      # each breaking one thing the self-test says it checks, each of which
      # must turn it red.  A green control set is a claim about the control
      # set; this is the thing that makes it a measurement.
      - name: test-tcheck
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/test-tcheck.py 2>&1 | tee ci-out/test-tcheck.out; exit "${PIPESTATUS[0]}"

      # rbcheck's controls run off captures committed in this repository --
      # bench/2026-08-25b/H2g.log and H2a.log, and since 2026-09-14 also
      # bench/2026-09-14/C1-P4rb.log and C1-P5rb.log with their UART halves --
      # so unlike hazlint, whose population control is 56 KiB of this unit's
      # bootloader and can never be committed, every one of them runs on a
      # stock runner. Several must FAIL for a pass to mean anything: a checksum
      # comparison that has not been shown able to fail is not a checksum
      # comparison, and C9 is the row that fails if the seal correction ever
      # becomes a no-op.
      #
      # 🔴 The count is NOT restated here. This comment said "ten controls" and
      # "six of the ten" on a day there were forty, which is CNT-1's class in
      # the workflow file. tools/ci-expected.tsv owns it and ci-census checks
      # it against what actually ran.
      - name: rbcheck self-test
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/rbcheck.py --self-test 2>&1 | tee ci-out/rbcheck.out; exit "${PIPESTATUS[0]}"

      # 🔴 The self-test above reported 10/10 while FOUR mutations lived, two of
      # them deleting the two comparisons the tool exists to make. An
      # adversarial pass found them. This suite is the answer: it mutates
      # rbcheck.py -- and, for M20, probe3.c -- and demands the suite notice.
      # A control that has not been shown able to fail is not a control.
      - name: rbcheck mutation suite
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/test-rbcheck.py 2>&1 | tee ci-out/test-rbcheck.out; exit "${PIPESTATUS[0]}"

      # flashwin renders the loader's `DW` reply for a window of flash out of a
      # dump, so that the ONE region the G8a/G8b bracket cannot cmp against a
      # committed capture -- H601, whose bytes are this unit's MAC and radio
      # calibration -- still has an expectation computed before the seating.
      #
      # 🔴 What runs HERE is the part that matters to a reader: the publication
      # guard, driven as a subprocess in all three directions, including that a
      # forbidden window may not be written inside this repository and that it
      # writes NO digest (a hash over a window whose only unknown is 24 bits of
      # MAC is a 2^24 search). R1-R3 need the 4 MiB dump and stand down as one
      # skip line covering 3 -- and the tool's whole argument is that a reader
      # who cannot see the H601 rendering can see that the same renderer
      # reproduces two captures they CAN see, bench/2026-08-24d/G8a-rd{0,6}.log,
      # byte for byte.
      - name: flashwin self-test
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/flashwin.py --self-test 2>&1 | tee ci-out/flashwin.out; exit "${PIPESTATUS[0]}"

      # And the mutation suite flashwin never had. It is the tool three other
      # files in tools/ cite as the reason THEIR suite has a baseline case --
      # 2026-08-30, 8 of 8 killed with every kill invalid, because the harness
      # symlinked the repository root and _inside_repo resolves with realpath.
      # Both passes over it were run in a scratch directory and neither was
      # committed. This one is, with B0/A0/W0, and it went red on its first run
      # in three places: a matcher that stopped at the first occurrence of each
      # needle (the K-P3 shape is the same window at TWO destinations), an
      # address-column rule no case could see, and a row whose named case was
      # C9 where the measurement says C10.
      - name: flashwin mutation suite
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/test-flashwin-mutants.py 2>&1 | tee ci-out/test-flashwin-mutants.out; exit "${PIPESTATUS[0]}"

      # flrbracket reads the loader's `FLR` echo by machine before the operator
      # types `Y`. `FLR`'s first typed argument is the RAM DESTINATION and the
      # loader echoes `from <source> to <destination>` -- the other order -- so
      # a card that swaps them reads plausibly both ways. RUNSHEET §B3 makes
      # *read the echo first* a rule; this is the rule as an instrument.
      #
      # 🔴 It exists because the instrument it replaces was never shown to work
      # in the direction that matters. 量 2026-08-31 (seating 7): the shell
      # script that drove the bracket compared the flash source as TYPED (six
      # hex digits) against the loader's echo (zero-padded to eight), rejected
      # a CORRECT echo and sent `N`. Safe, and beside the point -- nothing had
      # ever shown it would refuse a WRONG echo.
      #
      # The corpus is nine real FLR echoes plus the eight `Y` replies and the
      # one `N` reply from that seating, so the P cases are hardware and only
      # the N cases are synthetic. Seven of the 50 drive the containment guard as
      # a subprocess: the two DW captures of an H601 window -- pre-read
      # included -- may not be written inside this repository, which is the
      # carried-forward row that a card template cannot close. Needs nothing
      # but git.
      - name: flrbracket self-test
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/flrbracket.py --self-test 2>&1 | tee ci-out/flrbracket.out; exit "${PIPESTATUS[0]}"

      # 🔴 And the mutation suite for it, in the same commit, because the tool
      # above is green on all 50 of its controls and this repository has
      # measured five times over what that is worth (spec-check 15/3 live,
      # console-capture 40/10, leakscan 17/8, flashwin 13/24).
      #
      # B0 is the FIRST case and it is not a mutant: the unmutated tool must be
      # green through the same temp root or the run refuses to report kills.
      # That is the fix for the flashwin pass which reported 8 of 8 killed with
      # every kill invalid. Every row also names the case it must turn red and
      # counts as a kill only if THAT case failed -- `rc != 0` alone is what
      # made those kills invalid. 量, the mutation suite's first run:
      # 19 of the 22 that existed then, three alive, and one of the
      # three was a control of the tool's own that could not fail.
      - name: test-flrbracket-mutants
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/test-flrbracket-mutants.py --jobs 8 2>&1 | tee ci-out/test-flrbracket-mutants.out; exit "${PIPESTATUS[0]}"

      # P1-2's injection harness.  It runs config/mfgtest.sh -- the device-side
      # factory checks -- against a fixture of /proc files and requires each
      # injection to turn the check it NAMES red.  It needs no board and no
      # $FWRE_WORK, because mfgtest.sh reads everything through $MFG_ROOT.
      #
      # The five class-R/P rows are physical (unplug the cable, lock a gpio
      # line, do not press the button) and stand down here as one skip line;
      # P1-4 runs them on the die.
      #
      # Its C1 control is the one that earns its place: it takes each rlxfw
      # driver's own /proc format strings out of the C and requires every
      # field the script reads to be emitted by the driver that owns that
      # file.  量 on its first run, that caught a real defect -- the timer
      # emits `name=value` where every other driver emits `name value`, so
      # the script could not read a single field of /proc/rtl819x-timer, and
      # the fixture had been written in the same wrong format as the parser.
      - name: mfginject
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/mfginject.py 2>&1 | tee ci-out/mfginject.out; exit "${PIPESTATUS[0]}"

      # P1-1's DoD requires the boot-capture byte count to be re-derived rather
      # than copied.  bootbytes is that derivation as a command: it recomputes
      # the non-mark constant from every committed boot capture and requires
      # ONE value across all of them (量 710, 95 captures, seven images).
      - name: bootbytes
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/bootbytes.py 2>&1 | tee ci-out/bootbytes.out; exit "${PIPESTATUS[0]}"

      # repdiff answers the question sha256sum cannot: WHICH bytes differ
      # between two builds of one tree, and in which section and symbol.  Its
      # controls build ELF32 big-endian images in memory, so nothing here needs
      # $FWRE_WORK, a cross toolchain or a 4 MB build product.
      - name: repdiff self-test
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/repdiff.py --self-test 2>&1 | tee ci-out/repdiff.out; exit "${PIPESTATUS[0]}"

      - name: test-repdiff-mutants
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/test-repdiff-mutants.py 2>&1 | tee ci-out/test-repdiff-mutants.out; exit "${PIPESTATUS[0]}"

      # looptime is R4-0's instrument.  It answers the two terms of the
      # development loop nobody had measured: the dead time between captures
      # in a seating, and power-on to a typeable prompt split at the first
      # byte the board drove.  Its fixtures are built in a TemporaryDirectory,
      # so it needs no capture, no device and no $FWRE_WORK.
      - name: looptime self-test
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/looptime.py --self-test 2>&1 | tee ci-out/looptime.out; exit "${PIPESTATUS[0]}"

      # citime is CI-5's instrument, and it exists because that row's rule
      # lived in prose and drifted from the number it governs three separate
      # ways -- `exec` quoted with `apt` inside it, an `apt` annotation that
      # changed population mid-series, and an `exec` that changed definition
      # mid-series (job wall-clock for three points, sum-of-steps for the
      # rest).  All three were found by re-deriving, none by re-reading.
      # Its fixtures are synthetic dicts, so it touches no network and no gh.
      - name: citime self-test
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/citime.py --self-test 2>&1 | tee ci-out/citime.out; exit "${PIPESTATUS[0]}"

      # `segments` is not a case suite over fixtures -- it is an audit of the
      # committed series, and it is here because the defect it catches took a
      # day to notice by eye.  量 2026-09-09: `CHANGEPOINT` was one hardcoded
      # string, the 2026-09-08 step was described in full in the comment above
      # `BIG3` and never declared, and `stats --since changepoint` therefore
      # pooled a 502 population with a 954 one and printed +/- 31.778 % over
      # n=69.  Its three cases do not move when a changepoint is declared, so
      # declaring one costs no census edit and a CENSUS-MISMATCH never becomes
      # the price of doing the right thing.  It reads ci-suite-cost.tsv only:
      # no gh, no network, no $FWRE_WORK.
      - name: citime segments
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/citime.py segments 2>&1 | tee ci-out/citime-segments.out; exit "${PIPESTATUS[0]}"

      - name: test-looptime-mutants
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/test-looptime-mutants.py 2>&1 | tee ci-out/test-looptime-mutants.out; exit "${PIPESTATUS[0]}"

      # xcheck is TOOL-1's instrument, and it is the first thing here that
      # compares two SUITES' subjects rather than one tool against itself.
      # looptime and boot-timeline both parse a capture's `.timing`, both map a
      # byte offset to a time, and both publish an interval anchored two bytes
      # apart; on 2026-09-01 they disagreed about the third and `SPEC.md`
      # `CLK-18` cited the wrong one.  Nothing asserted that two tools reading
      # one file agree, and `ci-census` counts cases per suite and never across
      # suites.  The self-test's fixtures are synthetic; the sweep reads the
      # committed captures under `bench/`, which every clone has.
      - name: xcheck self-test
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/xcheck.py --self-test 2>&1 | tee ci-out/xcheck.out; exit "${PIPESTATUS[0]}"

      # 🔴 The sweep prints ONE `ok` line whatever the corpus size, on purpose.
      # `test-boot-timeline`'s `B2` hardcoded a population and went red on three
      # consecutive seatings; a census row that moves when a capture is added is
      # the single largest recorded source of CI failure here.
      - name: xcheck sweep
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/xcheck.py sweep 2>&1 | tee ci-out/xcheck-sweep.out; exit "${PIPESTATUS[0]}"

      # looprun is R4-3's D3: the whole edit->result iteration as one command.
      # Its assertion is DERIVED, not typed -- `rlxfw-kbuild.sh` computes
      # RLXFW_SRC_ID as a sha256 over config/, `ID0` prints it on the board, and
      # the run requires the console to say the id the build just computed. So a
      # stale image, the vendor's firmware, and the loader's own re-staging of
      # flash after a watchdog reset are all red for the same reason.
      # `--self-test` drives `--mode replay`: no build, no port, no board, every
      # fixture a string in the file.
      - name: looprun self-test
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/looprun.py --self-test 2>&1 | tee ci-out/looprun.out; exit "${PIPESTATUS[0]}"
      # cardcheck reads a bench card the way the DEVICE will. It exists because
      # seating 7 typed `wc -lc < /dev/mtd0ro` and got `wc: not found`: `wc` is
      # one of this busybox's fifty applets and is NOT one of the eleven busybox
      # symlinks the image declares. `FW-26` answers *what can this binary do*;
      # a cell needs *what can this image invoke*, and nothing compared the two.
      # Its A11 control runs the whole committed block-3 card and requires
      # exactly the two cells that failed at the bench -- so a regression is a
      # red case and not a paragraph. Needs no $FWRE_WORK and no device: the
      # declaration and every card are committed.
      - name: cardcheck self-test
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/cardcheck.py --self-test 2>&1 | tee ci-out/cardcheck.out; exit "${PIPESTATUS[0]}"

      # And the mutation suite, because green controls (26 when it arrived, 63
      # since FW-124) are a claim about the controls. Two of these survived their
      # first run -- a redirection target read as a command, and `nod` entries
      # folded into the invocable set -- invisible to the 23 cases of that day.
      - name: cardcheck mutation suite
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/test-cardcheck-mutants.py --jobs 8 2>&1 | tee ci-out/test-cardcheck-mutants.out; exit "${PIPESTATUS[0]}"
      # replay-capture turns a committed .log + .timing back into the terminal
      # it came from, so R3-11's artefact is DERIVED from evidence rather than
      # recorded beside it. Its R4 is the reason it is worth a suite: W-3, X-3
      # and V-3 are byte-identical across two power cycles and two days, so
      # three independent captures must give identical data and different
      # timing, and both halves are asserted. R12 hands the result to
      # scriptreplay(1) itself; if util-linux is absent that one case SKIPS
      # under the label ci-expected.tsv allows, and R14 checks the label.
      - name: replay-capture self-test
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/replay-capture.py --self-test 2>&1 | tee ci-out/replay-capture.out; exit "${PIPESTATUS[0]}"

      - name: replay-capture mutation suite
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/test-replay-capture-mutants.py 2>&1 | tee ci-out/test-replay-capture-mutants.out; exit "${PIPESTATUS[0]}"



      # binsim's controls need no vendor binary and no compiler: every fixture
      # is a synthetic ELF the tool builds itself. That is deliberate and it is
      # the opposite of hazlint, whose population control is 56 KiB of this
      # unit's bootloader and which CI therefore cannot run at all. The suite
      # below additionally drives the whole --corpus path -- manifest, both
      # matrices, the void verdict, the floor verdict, BASE and FLOOR --
      # against two corpora it builds in a temp directory, one landing on each
      # side of the floor verdict. So the only thing a runner does not exercise
      # is the assertions about the six real trees, and that count lives in
      # `tools/ci-expected.tsv` rather than being written twice here: it moved
      # 8 -> 22 on 2026-08-27 and this sentence carried the old number for one
      # commit, which is the failure the header above spends forty lines on.
      - name: binsim self-test
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/binsim.py --self-test 2>&1 | tee ci-out/binsim.out; exit "${PIPESTATUS[0]}"

      - name: test-binsim
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: bash tools/test-binsim.sh 2>&1 | tee ci-out/test-binsim.out; exit "${PIPESTATUS[0]}"

      # rebuild-census composes binsim, opcount and hazlint onto ONE window, so
      # it needs no apt: everything it imports is in this tree and its eight
      # controls run on synthetic ELFs. Four cases need $FWRE_WORK -- this unit's
      # flash dump and the rebuild outputs, neither of which can be committed --
      # and stand down as one skip line covering 4. The six mutation cases DO run
      # here, which is the point: they are what shows the controls guard anything.
      # R3-4's two gates.  Both are self-contained -- every control is built on
      # synthetic .config and declaration text -- so they run here in full, and
      # test-config-gates breaks each of them seven ways and names the control
      # that has to go red.
      - name: kconfig-delta
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/kconfig-delta.py self-test 2>&1 | tee ci-out/kconfig-delta.out; exit "${PIPESTATUS[0]}"

      - name: mkinitramfs
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/mkinitramfs.py self-test 2>&1 | tee ci-out/mkinitramfs.out; exit "${PIPESTATUS[0]}"

      # 🔴 The suite that says mkinitramfs's controls work, and it could
      # not exist until `cmd_verify` had any. Needs no device, no
      # $FWRE_WORK and no cross tools; it builds its own ELF and cpio.
      - name: test-mkinitramfs-mutants
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/test-mkinitramfs-mutants.py 2>&1 | tee ci-out/test-mkinitramfs-mutants.out; exit "${PIPESTATUS[0]}"

      - name: test-config-gates
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: bash tools/test-config-gates.sh 2>&1 | tee ci-out/test-config-gates.out; exit "${PIPESTATUS[0]}"

      - name: test-rebuild-census
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: bash tools/test-rebuild-census.sh 2>&1 | tee ci-out/test-rebuild-census.out; exit "${PIPESTATUS[0]}"

      # Both stand down on a runner and say so. test-vendor-tripwire needs a
      # vendor GPL drop clone to damage and restore; test-tc-smoke needs an rsdk
      # toolchain. In both, the case that makes the skip a skip rather than a
      # zero is the first one: with nothing to look at the tool exits 3 and
      # prints no table, so absence can never be read as a measurement.
      - name: test-vendor-tripwire
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: bash tools/test-vendor-tripwire.sh 2>&1 | tee ci-out/test-vendor-tripwire.out; exit "${PIPESTATUS[0]}"

      - name: test-tc-smoke
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: bash tools/test-tc-smoke.sh 2>&1 | tee ci-out/test-tc-smoke.out; exit "${PIPESTATUS[0]}"

      # 🔴 rlxfw-marks had NO CI step at all until 2026-09-02 (R5-0), and
      # nothing could have said so: `ci-census` compares ci-expected.tsv
      # against what ran, so a tool that was never in the table is invisible
      # to it. It is one of the TWO tools that edit Realtek's source (the other
      # is rlxfw-kbuild.sh, which applies config/host-compat/ with patch -p1),
      # and the one whose every inserted line is a declared row with a reason.
      # Its 32 controls had never run on a runner.
      - name: rlxfw-marks self-test
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/rlxfw-marks.py self-test 2>&1 | tee ci-out/rlxfw-marks.out; exit "${PIPESTATUS[0]}"

      # R5-0's blind-write ledger. The self-test is the instrument's controls;
      # `check` is the join between the ledger and the tree, and it is the one
      # that goes red as R5 proceeds -- writing about a new vendor file in
      # LOG.md makes it fail until the ledger says what was taken.
      - name: ledgerscan self-test
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/ledgerscan.py --self-test 2>&1 | tee ci-out/ledgerscan.out; exit "${PIPESTATUS[0]}"

      - name: derivcheck self-test
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/derivcheck.py --self-test 2>&1 | tee ci-out/derivcheck.out; exit "${PIPESTATUS[0]}"

      - name: ledgerscan check (exit-code gate)
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/ledgerscan.py check

      # Stands down on a runner (src-vendor/ is a symlink into $FWRE_WORK) and
      # prints the skip rather than passing silently.
      - name: ledgerscan quarantine (exit-code gate)
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/ledgerscan.py quarantine

      - name: ci-census self-test
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/ci-census.py --self-test 2>&1 | tee ci-out/ci-census.out; exit "${PIPESTATUS[0]}"

      # Two tools that do not print ok/FAIL/skip cases; they are exit-code gates
      # and are not in the census table. Named here so the difference is on
      # purpose rather than an omission.
      # It takes FILES, not a directory, and it runs every pattern against a
      # synthetic positive control before it will report on a real one.
      #
      # `*.log` only, and that is a scope decision recorded rather than a scan
      # narrowed until it went green. The logs are what the DEVICE said, and
      # they are what could carry its identity -- 0 hits over all of them.
      # `*.meta.json` and `*.timing` are what the INSTRUMENT recorded about the
      # host: they carry the bench's own 10.1.1.0/24 and `/home/key`, 25 hits,
      # every one of them a property of the operator's machine and none of them
      # of the unit. Two different questions, and only the first is this gate's.
      # 🔴 leakscan --self-test, and ONLY the self-test.
      # 🔄 2026-08-30 (fourteenth session): this comment used to say `git
      # ls-files` returns 795, that 555 files go unread and that they hold 97
      # identity hits. All three were arithmetic on a number nobody had
      # measured. 量, on a clean HEAD: the step above scans 240 files;
      # `git ls-files` returns 899 lines, one of them the submodule gitlink, so
      # 898 real files; 658 of them are never read, and `upstream/` adds 302
      # that `git ls-files` cannot see at all because a submodule is one
      # gitlink. 960 files unread, and 161 identity hits across the three
      # populations once `MAC, enx interface` is in the pattern list and the four
      # text extensions it used to call unreadable are in TEXTY. The count is
      # taken after the session's last edit, because the session's own files are
      # in the population -- it read 145, then 160, then 161.
      # The VERDICT run stays a desk step, and the reason is now a DECISION
      # rather than an open question: `--attribute` needs this unit's 4 MiB
      # dump, which can never be committed, and the one UNIT finding it reports
      # is left in place by the owner because the device is end of life
      # (`SPEC.md` §18). Allowlisting a hit to get a green build would be the
      # wrong order either way.
      # What runs here is seventeen controls -- sixteen on a runner, since L16
      # needs the dump -- including the three that make a clean result mean
      # anything: L4 (the population is non-empty), L5 (a finding never carries
      # the bytes that produced it) and L9 (nor does an attribution line, and
      # not the OUI either).
      - name: leakscan self-test
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/leakscan.py --self-test 2>&1 | tee ci-out/leakscan.out; exit "${PIPESTATUS[0]}"

      # 🔴 The mutation suite for it, and it is here for a measured reason
      # rather than for symmetry: `leakscan.py`'s `main()` returns on
      # `--self-test` BEFORE the reporting loop, so no control in the step
      # above can reach the population construction or the identity filter in
      # the report -- the same structural hole `test-spec-check-mutants.py`
      # exists for. 23 mutants in three phases; 20 run on a runner and the
      # three that drive `--attribute` need the dump. 量 2026-08-30: the first
      # run had EIGHT survivors, three of them defects in the mutants
      # themselves and five real gaps -- including a `render` that printed the
      # whole finding tuple, bytes included, past a control that checked two
      # string forms of the value and not its repr.
      - name: test-leakscan-mutants
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/test-leakscan-mutants.py --jobs 8 2>&1 | tee ci-out/test-leakscan-mutants.out; exit "${PIPESTATUS[0]}"

      - name: audit-bench-log (exit-code gate)
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/audit-bench-log.py $(find bench -type f \( -name '*.log' -o -name '*.events' -o -name '*.clock' -o -name '*.meta.json' \))

      # 🔴 `check-predictions.py --sweep bench` IS NOT HERE, and the reason is
      # the whole point of the tool. A step was written for it on 2026-08-29
      # and taken out the same hour, because the adversarial pass cloned this
      # repository and ran it: **git does not store mtimes.** `checkout@v4`
      # writes every file fresh, so bench/ arrives carrying a handful of
      # timestamps spanning tens of milliseconds, and the sweep reads
      # 128 of 156 cells as `capture is OLDER than the prediction`.
      # Reproduced independently on this machine, `git clone --depth 1` of this
      # very tree: `8 ordered, 128 OUT OF ORDER`, exit 1.
      #
      # So the ordering claim is a PRE-PUSH gate on the machine that took the
      # captures, and it cannot be anything else in this form. What CI can run
      # is the controls, above -- they build their own fixtures and are
      # clone-stable. 🔄 2026-09-08: HALF of the fix named here is now built,
      # and it is the next step down -- `capdate`. Every capture already
      # carries a committed `started_wallclock`, so the CAPTURE side is
      # clone-stable and that half is now a gate. The PREDICTION side still
      # has no committed timestamp and would need a declared `written:` line
      # inside the file, which the blocks already frozen cannot have. So the
      # ORDERING claim stays a pre-push gate; only the directory-name claim
      # moved. Carried forward in PROGRESS.md rather than half-done.

      # 🔴 And THIS is that fix, arriving 2026-09-08. `capdate` compares each
      # capture's committed `started_wallclock` against the `bench/<date>/`
      # directory it sits in. That comparison is clone-stable -- the timestamp
      # is content, not metadata -- which is exactly why it lives in its own
      # tool rather than inside check-predictions, whose docstring says at
      # length that it can never be a CI gate. `RUNSHEET`'s lifecycle rule 3
      # ends with a ⚠️ naming this check as missing; three consecutive
      # seatings hit rule 3 and a human caught all three.
      #
      # 量 on its first sweep: bench/2026-08-30 and -30b, all captured 08-29,
      # declared by name in KNOWN_MISNAMED. 🔄 2026-09-23 (P2-2, CAPD-1): the
      # same run checks each CARD's **declared date** (D5-D10); its first
      # sweep found B35 declaring 09-21 while every dated capture its cells
      # fence ran 09-20 (KNOWN_CARD_DATE). Both lists are swept both ways, so
      # an entry that stops applying is an error rather than a comfort.
      - name: capdate
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/capdate.py bench 2>&1 | tee ci-out/capdate.out; exit "${PIPESTATUS[0]}"

      # `FW-70`'s instrument. Two estimators over committed .timing files; one
      # of them REFUSES on this console and the refusal is the point -- at
      # 38400 the reader is faster than the wire, so every read returns 3-4
      # bytes and a slope fitted through that range is meaningless. S7/S8
      # quantify how meaningless: the same estimator is 0.11 bits low over
      # chunk sizes [1,60] and 2.41 bits low over [1,12].
      #
      # 🔴 The self-test exists because this tool's own first synthetic model
      # was WRONG -- it added the USB latency floor to elapsed TIME, so a true
      # 10.00 bits/char stream read as 16.33 and three cases fired. A latency
      # timer delays a TIMESTAMP; it does not slow the wire.
      - name: uartrate
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/uartrate.py selftest 2>&1 | tee ci-out/uartrate.out; exit "${PIPESTATUS[0]}"

      # `FW-64`'s `+3`, re-derived from the raw captures by a tool written
      # without the one that produced the finding in front of it. Two steps,
      # not one, the shape emueq already uses: a self-test proves the check
      # CAN fail and says nothing about whether this tree passes it.
      - name: procgrow self-test
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/procgrow.py --self-test 2>&1 | tee ci-out/procgrow.out; exit "${PIPESTATUS[0]}"

      # And the sweep in anger. Its first five lines carry numbers that move
      # when a capture is added and a case COUNT that does not, which is what
      # this file's rule about census rows moving with the corpus requires.
      - name: procgrow check
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/procgrow.py 2>&1 | tee ci-out/procgrow-check.out; exit "${PIPESTATUS[0]}"

      # The shared field reader the four false stops of seating 16 are the
      # specification for: strip CR, read read_proc FIELDS and never marks,
      # refuse a field that occurs more than once, and require an explicit
      # --base because `n_writes 0` is decimal and `sfcr FFC00000` is not.
      # Its self-test runs against committed captures whose answers are known,
      # so it is a real gate here and not a fixture exercise.
      - name: capfield
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/capfield.py selftest 2>&1 | tee ci-out/capfield.out; exit "${PIPESTATUS[0]}"

      # `FW-83`. What this image can INVOKE, read statically out of this unit's
      # own busybox -- the question `FW-46`'s own warning says nothing here can
      # ask before a card is frozen, and that `FW-25` answered once on
      # 2026-08-29 and recorded as a COUNT rather than a list.  The extraction
      # half reads $FWRE_WORK and is bench-only; these two read the committed
      # TSV and run anywhere.
      - name: appletcensus
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/appletcensus.py --self-test 2>&1 | tee ci-out/appletcensus.out; exit "${PIPESTATUS[0]}"

      - name: appletcensus check
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/appletcensus.py check 2>&1 | tee ci-out/appletcensus-check.out; exit "${PIPESTATUS[0]}"

      # The desk half of rtl819x-spi 1.1's `map`. Ten of its twelve controls
      # are synthetic and run here; F1/F1b need this unit's dump and stand
      # down, which is the same split flashwin has and for the same reason.
      # It imports flashwin.overlaps_forbidden rather than restating the H601
      # rule, and F8 is the control that says the import is load-bearing.
      - name: netblast
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        # 🆕 2026-09-21 (seating 36).  The instrument that drove the loader
        # ladder.  Its C1a-C1e re-derive bench/2026-09-21e/y5-rateladder.py's
        # constants FROM THAT FILE, so "the two runs had the same dose" is
        # checked rather than asserted; C3a-C3e drive the liveness probe in
        # both directions with injected runners, so a SILENT reading has a
        # positive control behind it.  Needs no board, no network and no vendor material: C2 paces UDP to 127.0.0.1.
        run: /usr/bin/python3 tools/netblast.py self-test 2>&1 | tee ci-out/netblast.out; exit "${PIPESTATUS[0]}"

      - name: flashmap
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/flashmap.py controls 2>&1 | tee ci-out/flashmap.out; exit "${PIPESTATUS[0]}"

      # R5-7's desk half. It attributes register-address materialisations to
      # `System.map` symbols WITHOUT reading what any function does, which is
      # what keeps `docs/blind-write-ledger.md` § 4.1's `led` domain at zero
      # while the question "how many other writers are there" gets an answer.
      # All twenty-one controls are synthetic -- no artefact, no toolchain, no
      # vendor material -- so it declares NO skip and the not-run-total does
      # not move.
      - name: regcensus
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/regcensus.py --self-test 2>&1 | tee ci-out/regcensus.out; exit "${PIPESTATUS[0]}"

      # R6-0's owed half, and 🔴 IT IS NOT `regcensus` ABOVE. That tool reads a
      # disassembly and a System.map; this one reads the vendor's C header.
      # `PROGRESS.md` §Now says "regcensus 沒有以工具的形式提交到 tools/" while a
      # tool of that exact name sits one step above this one, green -- an id
      # collision, the second in this project after `NET-14`. The name was not
      # reused; the reason is in this tool's own docstring so that a reader who
      # finds either one is told there are two.
      #
      # WHY IT EXISTS: `SPEC.md` `NET-21` derives this project's switch-register
      # population from 48 `lui` sites in the LOADER. That is what one agent
      # touched, not what configures the switch -- so `MSCR` (the acceleration
      # master switch), `VCR0` (the 802.1Q-unaware bit) and `SWTCR1` were
      # invisible to it, and `R6-2`'s definition names all three. This takes the
      # population from the DECLARATION side instead.
      #
      # The correctness property is the `#if` handling: the header defines
      # `PCRP`'s bit positions twice with different values, so a grep-shaped
      # census produces a field map wrong for whichever part you hold. K3/K4 are
      # that pair and a conditional-blind implementation passes exactly one.
      # All eighteen controls are synthetic -- the live census needs
      # src-vendor/, which is not committed, and is a desk command rather than a
      # case -- so this declares NO skip and the not-run-total does not move.
      - name: hdrcensus
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/hdrcensus.py --self-test 2>&1 | tee ci-out/hdrcensus.out; exit "${PIPESTATUS[0]}"

      # CITE-2. This repository cites its own files as `FILE:NNN`, and a line
      # inserted above a cited row silently re-points every citation below it.
      # `spec-check`'s C11 covers one population -- the payload sources under
      # config/rlxfw-src/ -- by carrying a token from the line; citecheck
      # covers every tracked file and uses an oracle C11 does not have: blame
      # the CITING line, read the cited file at that commit, and find where
      # that content is now. 量 2026-09-15 over HEAD: 239 live citations, 163
      # stable, 57 rotted, 16 whose content no longer exists at all.
      #
      # The 57 are on tools/citecheck-baseline.tsv, keyed on the CONTENT of
      # the cited row rather than on its line number -- several of them sit in
      # PROGRESS.md rows that frozen bench cards pin BY LINE NUMBER, so they
      # cannot be repaired without destroying the evidence check-predictions
      # reads. The gate is: nothing NEW, and no baseline row that has stopped
      # naming a finding.
      #
      # 🔴 This step needs fetch-depth: 0 above. It refuses on a shallow
      # checkout rather than reporting 100 % stable.
      - name: citecheck
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/citecheck.py 2>&1 | tee ci-out/citecheck.out; exit "${PIPESTATUS[0]}"

      # The process-level half: exit codes, the two-space contract with
      # ci-census, and whether the COMMITTED baseline is a file a reviewer can
      # read. Its shallow-clone case makes a real --depth 1 clone of a fixture
      # and requires the refusal; if git will not make one here that case
      # SKIPS under the label ci-expected.tsv allows.
      - name: test-citecheck
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: bash tools/test-citecheck.sh 2>&1 | tee ci-out/test-citecheck.out; exit "${PIPESTATUS[0]}"

      # And the mutation suite, because thirty-six green controls is a claim
      # about the controls. Five of its twenty-three survived their first run:
      # two were defects in citecheck (a URL filter that could not fire, and a
      # bare-CR control that asserted STABLE where the convention decides a
      # NUMBER) and three were controls asserting the wrong quantity. None was
      # visible to the thirty-three cases that existed then.
      - name: test-citecheck mutation suite
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/test-citecheck-mutants.py 2>&1 | tee ci-out/test-citecheck-mutants.out; exit "${PIPESTATUS[0]}"

      # The state documents' size budgets, in both directions: a document over
      # its budget fails, and so does a budget left at more than twice what it
      # measures (tools/docsize.py, SPEC.md FW-112).
      - name: docsize
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/docsize.py 2>&1 | tee ci-out/docsize.out; exit "${PIPESTATUS[0]}"

      # Text moved out of a state document must arrive intact in one file.
      - name: docmove self-test
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/docmove.py --self-test 2>&1 | tee ci-out/docmove.out; exit "${PIPESTATUS[0]}"

      # CLAUDE.md's former text, moved verbatim on 2026-09-23, stays whole.
      # Needs this job's fetch-depth: 0 (it reads e36acb4:CLAUDE.md).
      - name: docmove claude-md
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/docmove.py check --before e36acb4:CLAUDE.md --after docs/history/claude-md-2026-09-23.md 2>&1 | tee ci-out/docmove-claude.out; exit "${PIPESTATUS[0]}"

      - name: fetch-sources --list (offline; never fetches)
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: bash tools/fetch-sources.sh --list

      # hostprobe is P2-1's host-side instrument: the first ICMP echo reply
      # (D8), the first TCP success on a daemon's port (D4), neighbour-table
      # changes and UDP arrivals, stamped on CLOCK_MONOTONIC_RAW from 1.3
      # (CLOCK_MONOTONIC to 1.2; SPEC.md CLK-38). The self-test writes a FAKE
      # ping and a FAKE ip into a temporary directory and opens real sockets on
      # 127.0.0.1 only: no apt, no network beyond loopback, no device. Its RAW
      # cases run the tool under clockshim, below, which makes MONOTONIC
      # disagree with RAW. What it says about the REAL ping is a desk
      # measurement (notes/boot-time.md), not a case: a runner's ping is not
      # the bench's.
      - name: hostprobe self-test
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/hostprobe.py --self-test 2>&1 | tee ci-out/hostprobe.out; exit "${PIPESTATUS[0]}"

      # clockshim is P2-4's control for "this tool stamps CLOCK_MONOTONIC_RAW":
      # it runs a Python tool with every Python-level read of CLOCK_MONOTONIC
      # slowed and offset, because on a runner the two clocks agree to
      # milliseconds and a tool still stamping MONOTONIC would pass any bracket
      # a harness can draw (SPEC.md CLK-38). Its cases run small probes from a
      # temporary directory: no network, no gh, no device.
      - name: clockshim self-test
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/clockshim.py --self-test 2>&1 | tee ci-out/clockshim.out; exit "${PIPESTATUS[0]}"

      # iperflog reads the board's own iperf 3.1.3 server log (`iperf3 -s -1
      # -f k --logfile`, then `cat` over the console) into one row per interval
      # and one FIGURE per trial, and `compare` checks it against the host's
      # client log (P2-4). Seating A's board-receives trials never printed the
      # host's `receiver` line (SPEC.md NET-112); the board's server computed
      # the figure anyway. Its fixtures are whole server logs taken under qemu
      # from rlxfw's own iperf3 build -- the board's /bin/iperf3 -- kept in the
      # file as literals: no binary, no network, no device.
      - name: iperflog self-test
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/iperflog.py --self-test 2>&1 | tee ci-out/iperflog.out; exit "${PIPESTATUS[0]}"

      # hostclock logs the host's clocks for a whole seating on
      # CLOCK_MONOTONIC_RAW -- adjtimex read-only every second, a timerfd that
      # fires on every REALTIME step, Windows' clock through powershell.exe,
      # SNTP -- and converts REALTIME stamps onto RAW (SPEC.md CLK-38, CLK-39).
      # The self-test drives a fake SNTP server on 127.0.0.1, a fake
      # powershell and a simulated kernel PLL. HC10, a live REALTIME step, is
      # skipped here: nothing unprivileged can set a runner's clock.
      - name: hostclock self-test
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/hostclock.py --self-test 2>&1 | tee ci-out/hostclock.out; exit "${PIPESTATUS[0]}"

      # cardrun runs a frozen card's fenced cells verbatim and is the ONE owner of
      # the card grammar (SPEC.md FW-124, FW-132): cardcheck loads its macro,
      # HOST-line and shell readings by path, so the reading checked is the
      # reading run. Its self-test drives synthetic cards with fake hostprobe,
      # hostclock and console-capture programs in a temporary directory -- no
      # board, no port, nothing under bench/ -- and R12 parses card B44's own
      # § 5 to its 9 macros and 183 cells.
      - name: cardrun self-test
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/cardrun.py --self-test 2>&1 | tee ci-out/cardrun.out; exit "${PIPESTATUS[0]}"

      - uses: actions/upload-artifact@v4
        if: "${{ !cancelled() }}"
        with:
          name: ci-out-text
          path: ci-out/

  instruments:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # python3-serial and NOT actions/setup-python: tools/test-console-capture.sh
      # hardcodes /usr/bin/python3, and the apt module lands exactly there.
      # binutils only -- see the header for why gcc-mips-linux-gnu is absent.
      # qemu-system-mips is for tools/test-deskchan.sh. It is NOT the cross
      # compiler discussed in the header: it runs images, it does not build
      # them, so it cannot pull `tools/hazlint` and its stage2.bin control into
      # this job. The suite's D2 case builds its own twelve-instruction MIPS
      # image by hand, so with qemu present the whole suite runs on a stock
      # runner with no vendor material at all.
      # python3-yaml is here for `desk-sweep`, and it is declared rather than
      # assumed: the runner image probably carries it, and "probably" is not a
      # dependency. It is also why desk-sweep's self-test is in THIS job and
      # not beside `ci-census`'s in `text`, which installs nothing.
      # gcc is the HOST compiler, for nic15check, and it is declared for the
      # same reason python3-yaml is. It is not the cross compiler the header
      # talks about: it builds no MIPS code and pulls in no hazlint.
      - name: apt
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-serial binutils-mips-linux-gnu qemu-system-mips python3-yaml device-tree-compiler gcc

      - name: capture dir
        id: prep
        run: mkdir -p ci-out

      # desk-sweep runs every suite in THIS file at a desk, on a verified copy
      # of the tree. Its self-test is in CI and not only at the desk because
      # two of its fifteen controls are checks on THIS FILE and can only go
      # stale here:
      #   C9  the live ci.yml parses and declares >= 40 run steps -- the
      #       population control, without which C10's silence means nothing
      #   C10 the two `census` steps desk-sweep EXCUSES (red at a desk by
      #       construction) still exist here by name, and its safety rule --
      #       "no step needing root runs at a desk" -- still matches at least
      #       one live step. Rename a step and an excuse becomes an allow-list
      #       entry that can only grow; change how an apt step is spelled and a
      #       dead safety rule goes on printing zero.
      #   C10b the same rule refuses a non-zero number of steps HERE, so its
      #       verdict on this file is not vacuous.
      # C2 is the positive control that makes C1 mean anything: it runs the
      # line-based enumerator every desk sweep used until today against the
      # same fixture and requires it to come out SHORT. C3 is the positive
      # control on the copy verifier -- one byte changed in the copy must be a
      # refusal, or "the copy IS the source" is a line that cannot fail.
      - name: desk-sweep self-test
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/desk-sweep.py --self-test 2>&1 | tee ci-out/desk-sweep.out; exit "${PIPESTATUS[0]}"

      # `mustrun` names WHICH suites read files that changed, so a skipped
      # full sweep is auditable instead of invisible.  It exists because six
      # CI runs went red between 2026-09-13 and 2026-09-15 and every one of
      # them was a committed claim about this repository's own contents going
      # stale -- caught by a gate that already runs here, and not one of them
      # a code defect.  What failed was the desk closeout running a
      # hand-picked list of ten gates instead of `desk-sweep.py run`, which
      # costs ~1,000 s.  🔴 It does NOT replace that sweep.
      #
      # It is in THIS job for the same reason desk-sweep's self-test is: it
      # imports desk-sweep's `enumerate_steps`, and that needs the
      # python3-yaml the apt step above declares.
      #
      # 🔴 The cost of that placement is one declared skip.  This job
      # checks out at `fetch-depth: 1`, so the historical controls -- each one
      # of those red runs replayed over the range CI actually tested -- cannot
      # reach their shas here and stand down.  They run at a desk and on any
      # full clone; `ci-expected.tsv` covers 9.
      - name: mustrun
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/mustrun.py --self-test 2>&1 | tee ci-out/mustrun.out; exit "${PIPESTATUS[0]}"

      # 139 s on CI at 77 cases (run 35917302713). A pty, not a serial port.
      - name: test-console-capture
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: bash tools/test-console-capture.sh 2>&1 | tee ci-out/test-console-capture.out; exit "${PIPESTATUS[0]}"

      # 1304 s on CI at 64 mutants (run 35917302713); it stops the one above being a claim
      # that cannot fail: 量 2026-08-30, test-console-capture reported 40/40
      # while TEN mutations of the terminator guard it had just gained were
      # alive. Each mutant runs the WHOLE suite, because "the committed cases
      # catch it" is the claim and a fast proxy for the suite would be a
      # different one. --jobs 8 because the cases are sleep-bound (ptys and
      # played gaps) rather than CPU-bound, so they parallelise past the core
      # count. If the UNMUTATED baseline is not green it REFUSES rather than
      # reporting a clean sweep -- on a loaded runner that is the correct
      # failure and it is diagnosable, because the refusal prints the suite's
      # own tail.
      - name: test-console-capture-mutants
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/test-console-capture-mutants.py --jobs 8 2>&1 | tee ci-out/test-console-capture-mutants.out; exit "${PIPESTATUS[0]}"

      # C10 is a checker, and a checker's controls are a claim about the
      # controls. Twelve mutants of C10 against spec-check's own --self-test;
      # three survived the first run and are closed by T16, T17 and a fixture
      # fence; an adversarial pass then found that --self-test returns before
      # check_tables() is called at all, so phase 2 plants real defects in a
      # tracked file and runs the whole tool. 17 mutants. Synthetic throughout -- no device, no $FWRE_WORK, no pty.
      - name: test-spec-check-mutants
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/test-spec-check-mutants.py --jobs 8 2>&1 | tee ci-out/test-spec-check-mutants.out; exit "${PIPESTATUS[0]}"

      - name: test-opcount
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: bash tools/test-opcount.sh 2>&1 | tee ci-out/test-opcount.out; exit "${PIPESTATUS[0]}"

      # The vendor rsdk assemblers live in the GPL drops under $FWRE_WORK and are
      # not in a clone, so the twenty B-cases stand down here. The twenty that do
      # run drive `isa-probe.sh` with stub assemblers, and A1 is why the skip is a
      # skip: with no assembler the tool exits 3 and prints no table, so an absent
      # toolchain can never be read as twenty rejections.
      - name: test-isa-probe
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: bash tools/test-isa-probe.sh 2>&1 | tee ci-out/test-isa-probe.out; exit "${PIPESTATUS[0]}"

      # `R1-pub-0`'s census. T0 IS the `check` gate -- it runs it against a
      # byte-identical copy of the committed table and document -- so one step
      # covers both, and the nine mutations under it are what say the check can
      # fail. No vendor material, no device, no dump: it reads `tools/hazlint`,
      # `tools/isa-probe.sh` and SPEC.md's own parser, all of which are in a
      # clone.
      - name: isacensus
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/isacensus.py --self-test 2>&1 | tee ci-out/isacensus.out; exit "${PIPESTATUS[0]}"

      # `R1-pub-0b`'s census, the toolchain axis.  A SIBLING of the step
      # above rather than part of it: it imports isacensus's join
      # machinery and keeps its own table, its own document and its own
      # controls, so a defect in one census cannot hide the other.
      - name: tccensus
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/tccensus.py --self-test 2>&1 | tee ci-out/tccensus.out; exit "${PIPESTATUS[0]}"

      # `R1z-0`'s census, the DEBT axis, and the third sibling of the two
      # above.  It imports `isacensus`'s `Refused`/`doc_block` and
      # `spec-check`'s own `progress_step_state` rather than restating
      # either.  Its subject is `PROGRESS.md` section Carried forward, whose
      # own opening line -- an item with no owning gate is a bug in this list
      # -- nothing had checked in the twenty-five segments since it was
      # written.  量 on its first run: 44 rows whose every owning gate is
      # closed, 11 naming a gate that exists nowhere, 9 naming none at all.
      - name: cfcensus
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/cfcensus.py --self-test 2>&1 | tee ci-out/cfcensus.out; exit "${PIPESTATUS[0]}"

      # The ratchet, deliberately a SEPARATE step from the controls above so
      # that a debt moving cannot be read as a control breaking.  It is red
      # when the debt grows AND when it shrinks without `BASELINE` moving in
      # the same commit: a payment nobody records is how the table it reads
      # came to hold 44 orphans.  A plain `check` gate was rejected -- it
      # would be red on every run until `R1z` closes, and a step that is
      # always red trains a reader to stop reading reds.
      - name: cfcensus ratchet
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/cfcensus.py ratchet 2>&1 | tee ci-out/cfcensus-ratchet.out; exit "${PIPESTATUS[0]}"

      # `R1C-1-c`.  The decision in `docs/isa-prior-art.md` section 9.3 rests on
      # one measured sentence -- rlxfw's kernel and the vendor's have the same
      # emulation surface -- and that sentence can stop being true SILENTLY, by
      # one line entering `config/rlxfw-kernel.delta`.  The refutation condition
      # is written as a checker rather than a promise, and this is the step that
      # makes that true.  It reads two COMMITTED files, so it runs in a clone
      # where `src-vendor/` is a dangling symlink; `emueq refresh` is the desk
      # half that re-derives the table from the pinned drop.
      - name: emueq
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/emueq.py --self-test 2>&1 | tee ci-out/emueq.out; exit "${PIPESTATUS[0]}"

      # The same tool run in ANGER rather than on fixtures.  The self-test above
      # proves the check can fail; this proves the committed tree passes it, and
      # the two are different claims -- `emueq --self-test` would stay green on
      # a tree whose delta had grown a new emulation gate.
      - name: emueq check
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/emueq.py check 2>&1 | tee ci-out/emueq-check.out; exit "${PIPESTATUS[0]}"

      # `R1-pub-1`'s instrument.  probe4's cells are GENERATED from
      # tools/isa-payload.tsv, and this is the half of that which runs
      # without a cross compiler: the table's own rules, the encoding
      # check against the fields column, the expectation check against
      # an independent model, and unit tests of the two predicates that
      # need an artefact at the bench.
      - name: isapay
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/isapay.py --self-test 2>&1 | tee ci-out/isapay.out; exit "${PIPESTATUS[0]}"

      # `elfops` counts MIPS encodings BY OPCODE.  量 2026-09-15: the rsdk
      # objdumps decline to name `movz`/`movn` and print the raw word, so
      # grepping a disassembly for a mnemonic is a lower bound that looks
      # like a total.  C7/C8 cross-check ADDRESS FOR ADDRESS against
      # `tools/hazlint`'s own K6a pins and need $FWRE_WORK/stage2.bin,
      # which is this unit's bootloader and cannot be committed; they
      # skip here and the row says so.
      - name: elfops
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/elfops.py --self-test 2>&1 | tee ci-out/elfops.out; exit "${PIPESTATUS[0]}"

      # `emupredict` is the column ① -> column ② transform AS CODE.  `probe4`
      # runs 75 encodings bare metal at `Status = 0x1000FC00` (`CU0 = 1`) and
      # `uprobe` runs the SAME `cells4.S` bytes from Linux user mode; the
      # transform between the two columns -- three arms plus three exception
      # classes over eight named rows -- was frozen in
      # `bench/2026-09-15/PREDICTIONS-B22-block21.md` § 6.1/§ 6.2 BEFORE the
      # board was powered, and pre-registered per census row in
      # `docs/emulation-surface.md` § 3.  The tool derives column ② from
      # column ① ALONE and re-produces the card's own
      # `RAN 12, RIGHT 16, TRAPS 46, WRONG 1`.
      # 🔴 The controls are what make that worth anything.  C8/C9/C10 delete
      # an exception from a COPY of the rule table and require the predicted
      # line to change to a STATED wrong value -- a rule generator that cannot
      # produce a different answer proves nothing.  C19 re-derives
      # `docs/emulation-surface.md` § 3's hand-written `why` column from the
      # same rules, which is the second and independent side, and C20 plants a
      # wrong cell in a copy of that file and requires it to be reported.  C22
      # pins the exit codes apart: an absent input is 3 and not 1, because 1 is
      # this tool's code for A FINDING and a traceback would read as a refuted
      # rule set.
      # Everything it reads is committed here -- two bench captures, two TSVs
      # and one `.md` -- so there is no toolchain, no `$FWRE_WORK` artefact and
      # no device, and it declares no skip.
      - name: emupredict
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/emupredict.py --self-test 2>&1 | tee ci-out/emupredict.out; exit "${PIPESTATUS[0]}"

      # `R1-pub-4b`'s encoding join, 2026-09-16.  `ucost-cells.S` is HAND
      # WRITTEN -- a cost measurement needs the probed word inside a counted
      # loop, and `cells4.S`'s cells are shaped for one execution under a fault
      # handler, and `cells4.S` may not be touched at all because it feeds a
      # digest two artefacts join against.  So nothing structural makes the two
      # payloads agree on their encodings, and this is what does.
      #
      # 🔴 It is already a BUILD gate (`UG0` in the isaprobe Makefile), which
      # is exactly why it needs this: a gate that has only ever reported 0 is
      # making a claim nobody has tested.  Eight of the ten cases are negative
      # -- one per check, plus the population control that stops the other nine
      # passing on a fixture the regex could not read.
      #
      # Everything it reads is committed here (`tools/isa-payload.tsv` and the
      # `.S`), so no toolchain, no `$FWRE_WORK` artefact, no device, no skip.
      - name: ucostcheck self-test
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/ucostcheck.py --self-test 2>&1 | tee ci-out/ucostcheck-self-test.out; exit "${PIPESTATUS[0]}"

      # And the same tool in ANGER rather than on fixtures -- the shape
      # `emueq-check` and `xcheck-sweep` already use.  `--self-test` proves the
      # check CAN fail and says nothing about whether THIS tree passes it.
      - name: ucostcheck
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/ucostcheck.py config/rlxfw-user/isaprobe/ucost-cells.S 2>&1 | tee ci-out/ucostcheck.out; exit "${PIPESTATUS[0]}"

      # `CPU-73`'s four costs were fitted at the desk on the seating's own night
      # and the fit was thrown away, so `docs/rlx-isa.md` § 9's promise -- an
      # instrument, a capture committed here, and the command that re-derives
      # the reading -- was FALSE for that row until 2026-09-16.
      #
      # 🔴 There is deliberately NO second `in anger` step of the shape
      # `ucostcheck` above carries, and that is a difference rather than an
      # omission: `ucostcheck --self-test` runs on synthetic fixtures, so a
      # green one says nothing about this tree, while thirty of this suite's
      # thirty-seven cases assert against the two committed captures directly.
      # The self-test IS the run in anger.  Both captures are committed here,
      # so no toolchain, no `$FWRE_WORK` artefact, no device, no skip.
      - name: ucostfit
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/ucostfit.py --self-test 2>&1 | tee ci-out/ucostfit.out; exit "${PIPESTATUS[0]}"

      # `R1b`'s three, 2026-09-13.  `hazpay` generates probe5 and holds the
      # two-source expectation check; `hazdecl` is probe5's BUILD GATE and its
      # two pure functions are what run here -- `tools/hazlint` itself needs a
      # linked ELF and a cross compiler, so the adjudication is tested against
      # fixtures and the invocation is tested at the desk.  `test-hazpay` is the
      # mutant runner that says the other two can fail, and it also runs
      # `emit --check` for BOTH generated payloads, which until today nothing ran.
      - name: hazpay
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/hazpay.py --self-test 2>&1 | tee ci-out/hazpay.out; exit "${PIPESTATUS[0]}"

      - name: hazdecl
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/hazdecl.py --self-test 2>&1 | tee ci-out/hazdecl.out; exit "${PIPESTATUS[0]}"

      # `R1f`/`R2c`'s one, 2026-09-14.  `tcpay` generates probe6 -- ten builds of
      # one C fragment by four toolchains -- and is ALSO its build gate, the same
      # inverted shape `hazdecl` has for probe5: `hazlint` exiting 0 on that
      # payload is a build FAILURE.  What runs here is the pure half: the table's
      # eight refusals, the emitter, the hazlint-output parser (including the
      # case that it must NOT read a number off a control line), and four cases
      # that drive the tool as a subprocess to read its exit code.  `gate` and
      # `verify` need a linked ELF and a cross compiler and are the desk half,
      # split out for exactly `isapay` T19's reason.
      - name: tcpay
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/tcpay.py --self-test 2>&1 | tee ci-out/tcpay.out; exit "${PIPESTATUS[0]}"

      - name: test-hazpay
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/test-hazpay.py 2>&1 | tee ci-out/test-hazpay.out; exit "${PIPESTATUS[0]}"

      # The 160-cell prediction in that census's § 8.1, made machine-
      # checkable against the committed assembler matrix.  No assembler
      # runs here: both inputs are committed markdown.
      - name: marchcmp
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/marchcmp.py --self-test 2>&1 | tee ci-out/marchcmp.out; exit "${PIPESTATUS[0]}"

      # Skips cleanly with no cross compiler: one skip line standing for all
      # 202 cases, which the census prints rather than hides.
      - name: test-rlxprobe
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: bash tools/test-rlxprobe.sh 2>&1 | tee ci-out/test-rlxprobe.out; exit "${PIPESTATUS[0]}"

      # The eighteen B/M cases read the GPL drop's own nfjrom and stand down
      # here; the fourteen that run exercise sum16, the cr6c header parser and
      # the ELF symbol reader on fixtures this suite builds. S3a-c pin the
      # exit contract, which is the part a runner can check and the bench
      # usually does not.
      - name: test-rtkimage
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: bash tools/test-rtkimage.sh 2>&1 | tee ci-out/test-rtkimage.out; exit "${PIPESTATUS[0]}"

      # Runs in full on a runner: D2 assembles its own MIPS payload, loads it
      # through the same -bios stub the real images use, and requires the
      # string back out of the emulated UART. Nothing here needs a GPL drop.
      - name: test-deskchan
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: bash tools/test-deskchan.sh 2>&1 | tee ci-out/test-deskchan.out; exit "${PIPESTATUS[0]}"

      # The reference set must be non-empty, and C1 flips a byte in its
      # lexicographically first file, so that file must have a byte to flip.
      - name: verify-backup-copy self-test
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: |
          mkdir -p /tmp/refset
          printf 'hello\n' > /tmp/refset/RESTORE.md
          head -c 4096 /dev/urandom > /tmp/refset/a.age
          bash tools/verify-backup-copy.sh --self-test /tmp/refset 2>&1 | tee ci-out/verify-backup-copy.out
          exit "${PIPESTATUS[0]}"

      # -------------------------------------------------------------------
      # R5's D2 -- the .dts and bindings under dt/.  dtc comes from apt above;
      # dtschema is a pip package and is installed into a venv rather than with
      # --break-system-packages, because Ubuntu 24.04 is PEP 668 and a runner
      # that silently falls back to the system python is a different
      # experiment from the desk's.
      # 🔴 PINNED 2026-09-19, and the pin is a MEASUREMENT rather than a habit.
      # This install was unpinned, and 量 on two runs seventeen hours apart --
      # the version is printed by the line below, so both logs carry it --
      # the GREEN run 35387305159 got dt-validate (2026.6) and reported
      # `ok C1`, and the RED run 35425822141 got (2026.9) and reported
      # `FAIL C1`, on the same .dts with no commit touching dt/.
      # An unpinned dependency makes a green run unreproducible: the tree did
      # not move, the answer did.
      #
      # ⚠️ THE PIN IS NOT A VERDICT ON THE COMPLAINT.  2026.9 rejects
      # `linux,code`, `debounce-interval` and `default-state` as `bytes` where
      # it wants an integer.  The .dts writes them the ordinary way
      # (`linux,code = <408>`), so this looks like a dtschema regression in
      # reading u32 cells back out of a DTB -- but "looks like" is not a
      # reading, and this file's own dtcheck entry records that all three dt
      # tools print real failures and exit 0, which is exactly the shape that
      # makes a wrong dismissal cheap.  Adjudicating 2026.9's three complaints
      # is carried in docs/KNOWN-ISSUES.md, and the pin exists so that CI goes
      # red for the repository's reasons until somebody does.
      - name: dtschema
        id: dtschema
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: |
          /usr/bin/python3 -m venv /tmp/dtvenv
          /tmp/dtvenv/bin/pip install -q 'dtschema==2026.6'
          /tmp/dtvenv/bin/dt-validate --version

      # 23 controls, and they are the reason the step below is worth reading.
      # 量 2026-09-09: dtc, dt-doc-validate and dt-validate ALL print a real
      # failure and exit 0, so a checker built on exit status reports a perfect
      # green on a device tree that fails every stage. Every negative case here
      # has a positive twin on the same stage, T3b/T4b assert the two defect
      # classes dt-doc-validate does NOT see (so a future version that starts
      # seeing them turns this suite red instead of quietly making dtcheck's
      # own A2/A3 stages redundant), and T14 fails if the exit-status
      # unreliability that justifies this whole file ever goes away.
      - name: dtcheck self-test
        if: "${{ !cancelled() && steps.prep.outcome == 'success' && steps.dtschema.outcome == 'success' }}"
        run: DTCHECK_VENV=/tmp/dtvenv /usr/bin/python3 tools/dtcheck.py --self-test 2>&1 | tee ci-out/dtcheck-self-test.out; exit "${PIPESTATUS[0]}"

      # The tree itself. --min-bindings is a population control: a glob that
      # matched nothing must REFUSE (exit 2) rather than report a green, and
      # the floor is raised when dt/ grows and never lowered to make a run
      # pass. The kernel's Documentation/devicetree/bindings is NOT in the
      # corpus here, so every compatible it would have described is enumerated
      # by name in dt/unmatched-allow.tsv and an undeclared one is a finding.
      - name: dtcheck
        if: "${{ !cancelled() && steps.prep.outcome == 'success' && steps.dtschema.outcome == 'success' }}"
        run: DTCHECK_VENV=/tmp/dtvenv /usr/bin/python3 tools/dtcheck.py 2>&1 | tee ci-out/dtcheck.out; exit "${PIPESTATUS[0]}"

      # nic15check (R6b-2) compiles rtl819x-nic 1.5's pure half -- the header
      # config/rlxfw-src/linux-2.6.30/drivers/net/rtl819x-nic-tx.h, UNCHANGED --
      # with the host's gcc in the kernel's dialect, warnings as errors, and
      # drives its parsers, refusal table, length policy, identification,
      # classifier, the sweep's bookkeeping and the owner's wire bound,
      # dispatcher and page formatters (K0-K21). It then mutates a copy
      # twenty-five ways and requires the case named for each mutant to go red
      # (M1-M25), after M0 has shown the unmutated copy green through the same
      # path; M23 crashes the harness on
      # purpose and must be counted as a kill with its reason, not refuse the
      # run. Without gcc it REFUSES (exit 2) rather than reporting. What it
      # cannot see is the kernel half -- the hooks, the locks, the sweep's
      # waits -- which is the bench's; tools/storeseq.py reads the objects for
      # "default = 1.4".
      - name: nic15check
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/nic15check.py 2>&1 | tee ci-out/nic15check.out; exit "${PIPESTATUS[0]}"

      # storeseq's comparison needs the built ELFs, which exist only under
      # $FWRE_WORK, so it is a desk tool; its SELF-TEST needs nothing but
      # python -- synthetic listings and symbol tables, S0-S18: the store
      # sequence, the both-inlined container, the identity check of untouched
      # functions (a moved global reads the same, a renamed register does
      # not; a stale TOUCHED declaration is red) and the initial-word check.
      - name: storeseq self-test
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/storeseq.py --self-test 2>&1 | tee ci-out/storeseq.out; exit "${PIPESTATUS[0]}"

      # linkprobecheck (R6b-6) compiles config/rlxfw-user/linkprobe/linkprobe.c
      # with the HOST gcc and -DLP_HOST, which swaps its four system shims for
      # a scripted SIOCETHTOOL, a clock that moves only when the program
      # sleeps, and a call log. K1-K13: the fourteen lines of `get rlx0 lo eth4
      # nosuch0` with the board's errno numbers (122, 19, not a PC's 95); the
      # canary (a kernel that returns 0 without writing reads A5A5A5A5, never
      # 1); every argument refusal on both sides of its bound, with no call
      # made; the watch mode's transitions and both bounds on n. M0 runs the
      # unmutated source through the mutation path, and M1-M22 must each turn
      # the case they name red. Without gcc it REFUSES (exit 2). What it cannot
      # see is the ABI: that is the MIPS build's gate G6, and the board's.
      - name: linkprobecheck
        if: "${{ !cancelled() && steps.prep.outcome == 'success' }}"
        run: /usr/bin/python3 tools/linkprobecheck.py 2>&1 | tee ci-out/linkprobecheck.out; exit "${PIPESTATUS[0]}"

      - uses: actions/upload-artifact@v4
        if: "${{ !cancelled() }}"
        with:
          name: ci-out-instruments
          path: ci-out/

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      # --severity=error is green today. --severity=warning is red with six
      # SC2034s -- `read -r` destructuring and one genuinely unused variable.
      # Shipping a gate that is red on arrival teaches people to ignore it, so
      # this is the level that holds, and raising it is its own commit.
      - run: shellcheck --severity=error tools/*.sh

  census:
    # THE JOB THAT STOPS THE BADGE FROM BEING A CLAIM THAT CANNOT FAIL.
    needs: [text, instruments]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/download-artifact@v4
        with: { path: dl }
      - name: merge the captures
        run: mkdir -p ci-out && cp -v dl/*/*.out ci-out/
      - name: census
        run: /usr/bin/python3 tools/ci-census.py tools/ci-expected.tsv ci-out
